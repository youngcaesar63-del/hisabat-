<title>برنامج الحسابات — الوارد والمنصرف</title>
<style>
*,
*::before,
*::after { box-sizing: border-box; }

:root {
  --bg: #f4f7fb;
 --card: #ffffff;
  --ink: #0f172a;
  --ink-2: #475569;
  --ink-3: #5b6b7f;          /* 5.45:1 على الأبيض — كان #94a3b8 بنسبة 2.56:1 */
  --on-in: #065f46;
  --on-out: #991b1b;
  --on-tr: #1e40af;
  --btn-ink: #ffffff;
  --danger-ink: #ffffff;
  --line: #e4eaf2;
  --line-2: #d3dce8;
  /* سلّم المسافات والزوايا والظلال — يجعل الإيقاع البصري منتظماً */
  --s2: 10px; --s3: 14px; --s4: 18px; --s5: 24px; --s6: 32px;
  --r-sm: 9px; --r-md: 11px; --r-lg: 14px; --r-xl: 18px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-md: 0 1px 2px rgba(15, 23, 42, .05), 0 10px 26px -18px rgba(15, 23, 42, .35);
  --ring: 0 0 0 3px rgba(13, 148, 136, .18);
  --primary: #0f766e;
  --primary-2: #115e59;
  --primary-soft: #ccfbf1;
  --in: #047857;             /* 5.48:1 على الأبيض */
  --in-soft: #d1fae5;
  --out: #dc2626;
  --out-soft: #fee2e2;
  --tr: #2563eb;
  --tr-soft: #dbeafe;
  --sidebar: #0b3b39;
  --sidebar-ink: #d1faf5;
}

[data-theme="dark"] {
  --bg: #0a1220;
  --card: #111c2d;
  --ink: #e6edf7;
  --ink-2: #a9b8cd;
  --ink-3: #8a9db6;          /* 6.16:1 على البطاقة الداكنة */
  --on-in: #6ee7b7;
  --on-out: #fca5a5;
  --on-tr: #93c5fd;
  --btn-ink: #04231f;        /* النص الغامق على الزر الفاتح بدل الأبيض (كان 1.86:1) */
  --danger-ink: #450a0a;
  --line: #223047;
  --line-2: #2d3f5c;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-md: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 30px -20px rgba(0, 0, 0, .8);
  --ring: 0 0 0 3px rgba(45, 212, 191, .22);
  --primary: #2dd4bf;
  --primary-2: #14b8a6;
  --primary-soft: #123c3a;
  --in: #34d399;
  --in-soft: #0d3327;
  --out: #f87171;
  --out-soft: #3b1414;
  --tr: #60a5fa;
  --tr-soft: #12233f;
  --sidebar: #071c2b;
  --sidebar-ink: #cffafe;
}

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Tahoma", "Cairo", "Noto Naskh Arabic", "Arial", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}

/* تحديد النص بلون الهوية، وأشرطة تمرير رقيقة متناسقة مع المظهرين */
::selection { background: rgba(13, 148, 136, .22); }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: content-box; }

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--primary); }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.2px; }

/* ===== layout ===== */
.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: 252px;
  flex: 0 0 252px;
  /* لون صلب + تدرّج فوقه: اللون الصلب يبقي التباين قابلاً للحساب وللطباعة */
  background-color: var(--sidebar);
  background-image: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(0, 0, 0, .28));
  color: var(--sidebar-ink);
  padding: var(--s4) var(--s2);
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: inset -1px 0 0 rgba(255, 255, 255, .06);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 40;
}

.brand { display: flex; align-items: center; gap: var(--s2); padding: 4px var(--s2) var(--s4); }
.brand-mark {
  width: 40px; height: 40px; border-radius: 12px; flex: 0 0 40px;
  background: linear-gradient(135deg, #2dd4bf, #0d9488);
  display: grid; place-items: center; color: #04231f; font-weight: 800; font-size: 19px;
  box-shadow: 0 6px 16px -8px rgba(45, 212, 191, .9), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.brand-txt b { display: block; font-size: 15px; line-height: 1.2; }
.brand-txt span { font-size: 11.5px; opacity: .7; }

.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: transparent; border: 0; color: inherit; text-align: right;
  padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; font-size: 14px;
  transition: background .16s ease, color .16s ease, box-shadow .16s ease;
}
.nav-btn:hover { background: rgba(255, 255, 255, .08); }
.nav-btn:active { background: rgba(255, 255, 255, .14); }
.nav-btn.active {
  background: linear-gradient(90deg, rgba(45, 212, 191, .26), rgba(45, 212, 191, .10));
  color: #fff; font-weight: 700;
  box-shadow: inset -3px 0 0 #2dd4bf, inset 0 0 0 1px rgba(45, 212, 191, .18);
}
.nav-btn .ico { font-size: 16px; width: 22px; text-align: center; flex: 0 0 22px; }
.nav-sep { height: 1px; background: rgba(255, 255, 255, .1); margin: 10px 6px; }
.sidebar-foot { margin-top: auto; font-size: 11.5px; opacity: .6; padding: 12px 8px 4px; }

.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: var(--s3) var(--s5); background: var(--card); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
  box-shadow: 0 8px 24px -22px rgba(15, 23, 42, .55);
}
.topbar h1 { font-size: 19px; letter-spacing: -.3px; }
.tb-title { min-width: 0; }
.topbar .btn { flex: 0 0 auto; }
.topbar .sub { font-size: 12.5px; color: var(--ink-3); }
.spacer { flex: 1 1 auto; }

.topbar .hamburger { display: none; }

/* رابط «تجاوز إلى المحتوى» — يظهر فقط عند التنقّل بلوحة المفاتيح */
.skip-link {
  position: absolute; top: -60px; right: 12px; z-index: 400;
  background: var(--primary); color: var(--btn-ink); padding: 10px 16px;
  border-radius: 0 0 10px 10px; font-weight: 700; text-decoration: none;
  transition: top .15s ease;
}
.skip-link:focus { top: 0; }

.content { padding: var(--s5) var(--s5) 44px; max-width: 1280px; width: 100%; margin: 0 auto; }

/* ===== buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  background: var(--primary); color: var(--btn-ink); border: 1px solid transparent;
  padding: 9px 16px; min-height: 38px; border-radius: var(--r-md); cursor: pointer; font-weight: 600; font-size: 14px;
  transition: filter .16s ease, transform .06s ease, background .16s ease, box-shadow .16s ease, border-color .16s ease;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .10), inset 0 1px 0 rgba(255, 255, 255, .12);
}
.btn:hover { filter: brightness(1.07); box-shadow: 0 4px 14px -8px rgba(15, 118, 110, .65), inset 0 1px 0 rgba(255, 255, 255, .16); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-2); box-shadow: none; }
.btn.ghost:hover { background: var(--bg); border-color: var(--ink-3); filter: none; box-shadow: none; }
.btn.danger { background: var(--out); color: var(--danger-ink); }
.btn.sm { padding: 6px 12px; min-height: 32px; font-size: 13px; border-radius: var(--r-sm); }
.btn.block { width: 100%; }
.icon-btn {
  background: transparent; border: 0; cursor: pointer; color: var(--ink-3);
  width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; font-size: 15px;
  vertical-align: middle; transition: background .14s ease, color .14s ease, transform .06s ease;
}
.icon-btn:hover { background: var(--bg); color: var(--ink); }
.icon-btn:active { transform: scale(.95); }

/* إطار تركيز ظاهر للمستخدمين الذين يتنقّلون بلوحة المفاتيح */
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }

/* ===== cards / grid ===== */
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g2a { grid-template-columns: 1.6fr 1fr; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-xl); box-shadow: var(--shadow-md); padding: var(--s4);
  min-width: 0;                     /* لا يمدّ الشاشة على الهاتف */
  transition: box-shadow .18s ease, border-color .18s ease;
}
.card h3 { font-size: 15.5px; margin-bottom: var(--s3); display: flex; align-items: center; gap: 8px; }
.card-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); flex-wrap: wrap; }
.card-head:has(h3) { padding-bottom: var(--s2); border-bottom: 1px solid var(--line); }
.card > h3:first-child { padding-bottom: var(--s2); border-bottom: 1px solid var(--line); }
.card-head h3 { margin: 0; }

.stat { position: relative; overflow: hidden; padding-inline-start: calc(var(--s4) + 4px); }
/* شريط لون على حافة البطاقة: كبسولة دقيقة لا تتبع تقويس الحدود (تبدو مقصودة على كل المقاسات) */
.stat::before {
  content: ''; position: absolute; inset-inline-start: 0; inset-block: 14px;
  width: 3px; border-radius: 99px; background: var(--line-2);
}
.stat.in::before { background: var(--in); }
.stat.out::before { background: var(--out); }
.stat.net::before { background: var(--primary); }
.stat .label { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.stat .value {
  font-size: 26px; font-weight: 800; letter-spacing: -.4px; margin-top: 2px;
  direction: ltr; text-align: right; font-variant-numeric: tabular-nums;
}
.stat .cur { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.stat .label .dot { box-shadow: 0 0 0 3px rgba(13, 148, 136, .10); }
.stat.in .value { color: var(--in); }
.stat.out .value { color: var(--out); }
.stat.net .value { color: var(--primary); }
.stat .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }

/* ===== table ===== */
.table-wrap { overflow-x: auto; border-radius: 12px; max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 11px 12px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
th {
  background: var(--bg); font-size: 12.5px; color: var(--ink-2); font-weight: 700; white-space: nowrap;
  position: sticky; top: 0; z-index: 1; box-shadow: inset 0 -1px 0 var(--line-2); letter-spacing: .1px;
}
tbody tr { transition: background .12s ease; }
tbody tr:nth-child(even) { background: rgba(15, 23, 42, .018); }
[data-theme="dark"] tbody tr:nth-child(even) { background: rgba(255, 255, 255, .022); }
tbody tr:hover { background: rgba(13, 148, 136, .07); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { direction: ltr; text-align: left; font-variant-numeric: tabular-nums; }
td.no-print, th.no-print { white-space: nowrap; }
tfoot td { font-weight: 800; background: var(--bg); border-top: 2px solid var(--line); }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }

.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700;
  padding: 3px 10px; border-radius: 999px; white-space: nowrap; line-height: 1.7;
  box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .06);
}
.badge.in { background: var(--in-soft); color: var(--on-in); }
.badge.out { background: var(--out-soft); color: var(--on-out); }
.badge.tr { background: var(--tr-soft); color: var(--on-tr); }
.badge.n { background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); }

.chip { display: inline-block; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--ink-2); }

/* ===== forms ===== */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .1px; }
.field .hint { font-size: 11.5px; color: var(--ink-3); }
input, select, textarea {
  width: 100%; padding: 10px 12px; min-height: 40px; border: 1px solid var(--line-2); border-radius: var(--r-md);
  background: var(--card); outline: none;
  transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
input:hover, select:hover, textarea:hover { border-color: var(--ink-3); }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: var(--ring); }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: .85; }
select { appearance: none; padding-inline-end: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(0% + 14px) calc(50% + 2px), calc(0% + 19px) calc(50% + 2px);
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
[data-theme="dark"] select {
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
}
input[readonly] { background: var(--bg); color: var(--ink-2); }
input.money {
  direction: ltr; text-align: right; font-variant-numeric: tabular-nums;
  font-size: 16px; font-weight: 700; letter-spacing: .3px;
}
input.money::placeholder { font-weight: 400; letter-spacing: 0; }
textarea { resize: vertical; min-height: 62px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.filters .field { min-width: 130px; }
.filters .grow { flex: 1 1 180px; }

.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 3px; gap: 3px; }
.seg button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer;
  font-size: 13.5px; font-weight: 700; color: var(--ink-2);
  transition: background .14s ease, color .14s ease;
}
.seg button:hover { color: var(--ink); }
.seg button.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }
.seg button.active[data-k="income"] { color: var(--in); }
.seg button.active[data-k="expense"] { color: var(--out); }
.seg button.active[data-k="transfer"] { color: var(--tr); }

/* ===== empty state ===== */
.empty { text-align: center; padding: 46px 16px; color: var(--ink-3); }
.empty .big {
  font-size: 26px; margin: 0 auto 12px; width: 64px; height: 64px; display: grid; place-items: center;
  border-radius: 50%; background: var(--bg); border: 1px dashed var(--line-2);
}

/* ===== chart ===== */
.chart { display: block; width: 100%; height: auto; max-height: 230px; }
.chart .bar-in { fill: var(--in); }
.chart .bar-out { fill: var(--out); }
.chart text { fill: var(--ink-3); font-size: 10.5px; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }

.bar-row { display: grid; grid-template-columns: 110px 1fr 92px; gap: 10px; align-items: center; font-size: 13px; margin-bottom: 9px; }
.bar-track { height: 9px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; background: var(--primary); }
.bar-fill.in { background: var(--in); }
.bar-fill.out { background: var(--out); }

/* ===== modal ===== */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(8, 20, 32, .55); backdrop-filter: blur(2px);
  display: flex; align-items: flex-start; justify-content: center; padding: 28px 14px; z-index: 100; overflow-y: auto;
}
.modal {
  background: var(--card); border-radius: var(--r-xl); width: 100%; max-width: 560px;
  border: 1px solid var(--line);
  box-shadow: 0 30px 80px -24px rgba(0, 0, 0, .55); animation: pop .16s ease-out; margin: auto;
  /* تبقى النافذة داخل الشاشة دائماً: الرأس والذيل ثابتان والوسط يتمرّر */
  display: flex; flex-direction: column; max-height: calc(100vh - 56px); max-height: calc(100dvh - 56px);
}
.modal-head, .modal-foot { flex: 0 0 auto; }
.modal.wide { max-width: 900px; }
@keyframes pop { from { transform: translateY(-8px) scale(.99); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); background: var(--card); border-radius: var(--r-xl) var(--r-xl) 0 0; }
.modal-head h3 { font-size: 16px; flex: 1; }
.modal-body { padding: var(--s4); overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-start; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--bg); border-radius: 0 0 16px 16px; }

/* ===== toast ===== */
#toastRoot { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: #0f172a; color: #fff; padding: 11px 18px; border-radius: var(--r-md); font-size: 13.5px;
  box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .6); animation: pop .18s ease-out; max-width: 92vw; font-weight: 600;
}
.toast.ok { background: #065f46; }
.toast.err { background: #991b1b; }
.toast.warn { background: #92400e; }

.notice {
  display: flex; gap: 10px; align-items: flex-start; background: #fffbeb; color: #92400e;
  border: 1px solid #fde68a; padding: 11px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 16px;
}
[data-theme="dark"] .notice { background: #2b2110; color: #fcd34d; border-color: #4a3a12; }
.notice.blue { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
[data-theme="dark"] .notice.blue { background: #10233f; color: #93c5fd; border-color: #1e3a5f; }

.scroll-y { max-height: 420px; overflow-y: auto; }

/* منع عناصر الشبكة من توسيع الصفحة: العنصر الأدنى عرضاً يجب أن يتقلّص لا أن يمدّ الشاشة */
.grid > *, .g2 > *, .g3 > *, .g4 > *, .g2a > * { min-width: 0; }

@media (max-width: 1050px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar {
    position: fixed; right: 0; left: auto; top: 0; height: 100vh; width: 268px; flex-basis: auto;
    transform: translateX(105%); transition: transform .22s ease;
    box-shadow: -20px 0 50px rgba(0,0,0,.3);
  }
  .layout.nav-open .sidebar { transform: none; }
  .icon-btn.hamburger { display: grid; width: 40px; height: 40px; font-size: 17px; }
  .g2a, .g2 { grid-template-columns: 1fr; }
  .content { padding: 14px; }
  .topbar { padding: 10px 14px; }
  .form-grid { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 84px 1fr 78px; }
}
@media (max-width: 560px) {
  .g4, .g3 { grid-template-columns: 1fr; }
  .stat .value { font-size: 21px; }
  .hide-sm { display: none; }

  /* نوافذ الهاتف: ورقة شبه كاملة العرض، وأزرار كبيرة سهلة اللمس */
  .modal-backdrop { padding: 10px 8px; }

<script>
// ===== محرك إنشاء ملفات XLSX بدون أي مكتبات خارجية =====
const _enc = new TextEncoder();

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(u8) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ u8[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files) {
  const parts = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  for (const f of files) {
    const data = _enc.encode(f.content);
    const crc = crc32(data);
    const name = _enc.encode(f.name);

    const lh = new Uint8Array(30 + name.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true);
    lv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);

    offset += lh.length + data.length;
  }

  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);

  const all = parts.concat(central, [eocd]);
  const total = all.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const a of all) { out.set(a, p); p += a.length; }
  return out;
}

function xmlEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
    // إزالة المحارف غير المسموحة في XML
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
}

function colName(n) { // 1 -> A
  let s = '';
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
  return s;
}

/* sheets: [{name, columns:[{title,width}], rows:[[cell,...]], totalRow:[...]}]
   cell: null | string | number | {v, b:true} (bold) | {v, n:'money'} */
function buildXlsx(sheets) {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const files = [];

  const st = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<styleSheet xmlns="${NS}">` +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00;[Red]-#,##0.00"/></numFmts>' +
    '<fonts count="4">' +
      '<font><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="14"/><name val="Calibri"/></font>' +
    '</fonts>' +
    '<fills count="4">' +
      '<fill><patternFill patternType="none"/></fill>' +
      '<fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FF0F766E"/><bgColor indexed="64"/></patternFill></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFF1F5F9"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="2"><border/><border><left style="thin"><color rgb="FFD1D5DB"/></left><right style="thin"><color rgb="FFD1D5DB"/></right><top style="thin"><color rgb="FFD1D5DB"/></top><bottom style="thin"><color rgb="FFD1D5DB"/></bottom></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="6">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' + // 0 normal
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' + // 1 header
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"><alignment horizontal="left"/></xf>' + // 2 money
      '<xf numFmtId="0" fontId="2" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/>' + // 3 bold
      '<xf numFmtId="164" fontId="2" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>' + // 4 bold money
      '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>' + // 5 title
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';
  files.push({ name: 'xl/styles.xml', content: st });

  const sheetEntries = [];
  sheets.forEach((sh, i) => {
    const cols = (sh.columns || []).map((c, ci) =>
      `<col min="${ci + 1}" max="${ci + 1}" width="${c.width || 14}" customWidth="1"/>`).join('');
    let rowsXml = '';
    let r = 0;
    const pushRow = (cells, styleDefault) => {
      r++;
      let cx = '';
      cells.forEach((cell, ci) => {
        if (cell === null || cell === undefined || cell === '') return;
        let v = cell, style = styleDefault, isStr = false;
        if (typeof cell === 'object') {
          v = cell.v;
          if (cell.n === 'money') style = styleDefault === 3 ? 4 : 2;
          if (cell.b) style = (cell.n === 'money') ? 4 : 3;
          if (cell.h) style = 1;
        }
        const ref = colName(ci + 1) + r;
        if (typeof v === 'number' && isFinite(v)) {
          cx += `<c r="${ref}" s="${style}"><v>${v}</v></c>`;
        } else {
          cx += `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
        }
      });
      rowsXml += `<row r="${r}">${cx}</row>`;
    };

    const headerRow = sh.title ? 2 : 1;
    if (sh.title) {
      r += 1;
      rowsXml += `<row r="${r}"><c r="A${r}" s="5" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(sh.title)}</t></is></c></row>`;
    }
    pushRow((sh.columns || []).map(c => ({ v: c.title, h: true })), 1);
    (sh.rows || []).forEach(row => pushRow(row, 0));
    if (sh.totalRow) pushRow(sh.totalRow, 3);

    const dim = r > 0 ? `A1:${colName(Math.max(1, (sh.columns || []).length))}${r}` : 'A1';
    const sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      `<worksheet xmlns="${NS}">` +
      `<dimension ref="${dim}"/>` +
      '<sheetViews><sheetView rightToLeft="1" tabSelected="1" workbookViewId="0">' +
      `<pane ySplit="${headerRow}" topLeftCell="A${headerRow + 1}" activePane="bottomLeft" state="frozen"/>` +
      '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="18"/>' +
      (cols ? `<cols>${cols}</cols>` : '') +
      `<sheetData>${rowsXml}</sheetData>` +
      (sh.rows && sh.rows.length ? '<autoFilter ref="A' + headerRow + ':' + colName(Math.max(1,(sh.columns||[]).length)) + r + '"/>' : '') +
      '</worksheet>';
    files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, content: sheetXml });
    sheetEntries.push({ name: sh.name.slice(0, 31) || ('ورقة' + (i + 1)), idx: i + 1 });
  });

  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    sheetEntries.map(s => `<Override PartName="/xl/worksheets/sheet${s.idx}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
    '</Types>';
  files.push({ name: '[Content_Types].xml', content: ct });

  files.push({
    name: '_rels/.rels',
    content: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>'
  });

  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<workbook xmlns="${NS}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
    '<workbookPr/>' +
    '<sheets>' + sheetEntries.map((s, i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets>' +
    '</workbook>';
  files.push({ name: 'xl/workbook.xml', content: wb });

  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheetEntries.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${s.idx}.xml"/>`).join('') +
    `<Relationship Id="rId${sheetEntries.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>` +
    '</Relationships>';
  files.push({ name: 'xl/_rels/workbook.xml.rels', content: rels });

  return makeZip(files);
}



/* =========================================================
   وحدة الأمان: تشفير النسخ الاحتياطية + تقوية كلمات المرور
   + حماية من التخمين + تعقيم النصوص
   تعمل محلياً بالكامل (WebCrypto) بلا مكتبات خارجية
   ========================================================= */

/* ---------- أدوات ---------- */
var SEC_SUBTLE = !!(window.crypto && window.crypto.subtle && window.crypto.subtle.importKey);
const PBKDF2_ITER = 210000;        // لكلمات المرور
const BACKUP_ITER = 310000;        // للنسخ المشفّرة
const ENC_FORMAT = 'hisabat-enc-v1';

function secBytes(n) {
  const a = new Uint8Array(n);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
  return a;
}
function secB64(bytes) {
  let s = '';
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
  return btoa(s);
}
function secUnb64(str) {
  const raw = atob(str);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function secHex(bytes) {
  return Array.from(new Uint8Array(bytes)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function secUtf8(str) { return new TextEncoder().encode(String(str)); }

/* ---------- PBKDF2 ---------- */
async function secPbkdf2Bits(pass, saltBytes, iter, bits) {
  const key = await crypto.subtle.importKey('raw', secUtf8(pass), { name: 'PBKDF2' }, false, ['deriveBits']);
  const buf = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: saltBytes, iterations: iter, hash: 'SHA-256' }, key, bits || 256);
  return buf;
}
async function secPbkdf2Key(pass, saltBytes, iter) {
  const key = await crypto.subtle.importKey('raw', secUtf8(pass), { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: iter, hash: 'SHA-256' },
    key, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

/* ---------- سجل كلمة المرور (يدعم الترقية من النظام القديم) ---------- */
async function secMakePwRecord(pw) {
  const salt = SEC_SUBTLE ? secHex(secBytes(16)) : newSalt();
  if (SEC_SUBTLE) {
    const bits = await secPbkdf2Bits(pw, secHexToSaltBytes(salt), PBKDF2_ITER);
    return { salt: salt, hash: secHex(bits), alg: 'pbkdf2-sha256-' + PBKDF2_ITER };
  }
  // بديل عند منع WebCrypto (نافذة معاينة مقيّدة): نفس النظام القديم بعدد دورات أعلى
  return { salt: salt, hash: hashPw(pw, salt), alg: 'sha256x800' };
}
function secHexToSaltBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}
async function secVerifyPw(pw, u) {
  if (!u) return false;
  if (u.alg && u.alg.indexOf('pbkdf2') === 0) {
    if (!SEC_SUBTLE) return false;
    const iter = parseInt(u.alg.split('-').pop(), 10) || PBKDF2_ITER;
    const bits = await secPbkdf2Bits(pw, secHexToSaltBytes(u.salt), iter);
    return secHex(bits) === u.hash;
  }
  // قديم
  return hashPw(pw, u.salt) === u.hash;
}
/* ترقية تلقائية للبصمة القديمة بعد أول دخول ناجح */
async function secUpgradePw(u, pw) {
  if (!u || !SEC_SUBTLE) return false;
  if (u.alg && u.alg.indexOf('pbkdf2') === 0) return false;
  const rec = await secMakePwRecord(pw);
  u.salt = rec.salt; u.hash = rec.hash; u.alg = rec.alg; u.updatedAt = Date.now();
  return true;
}

/* ---------- حماية من التخمين (محفوظة في الحالة: لا تُصفَّر بإعادة التحميل) ---------- */
function secState() {
  if (!S.settings.security || typeof S.settings.security !== 'object') {
    S.settings.security = { fails: 0, lockUntil: 0, lastFail: 0 };
  }
  return S.settings.security;
}
function secLockLeft() {
  const st = secState();
  const ms = (+st.lockUntil || 0) - Date.now();
  return ms > 0 ? Math.ceil(ms / 1000) : 0;
}
function secLockMinutes(fails) {
  if (fails < 5) return 0;
  const steps = [1, 2, 5, 10, 20, 30];
  return steps[Math.min(steps.length - 1, fails - 5)];
}
function secOnFail(name) {
  const st = secState();
  st.fails = (+st.fails || 0) + 1;
  st.lastFail = Date.now();
  const mins = secLockMinutes(st.fails);
  if (mins) st.lockUntil = Date.now() + mins * 60000;
  if (Array.isArray(S.audit)) {
    logAct('login', 'محاولة دخول فاشلة' + (name ? ' (' + name + ')' : '') + ' — المجموع ' + st.fails + (mins ? ' — قفل ' + mins + ' دقيقة' : ''));
  }
  saveNow();
  return { fails: st.fails, mins: mins };
}
function secOnSuccess() {
  const st = secState();
  st.fails = 0; st.lockUntil = 0;
  saveNow();
}

/* ---------- تعقيم النصوص ---------- */
/* esc موجودة في app.js وتغطي & < > " ' — هنا نضيف تنظيف المحارف الخطرة الخفية للملفات المستوردة */
function secCleanText(v) {
  return String(v == null ? '' : v)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
    .slice(0, 2000);
}
function secSanitizeDoc(o) {
  if (!o || typeof o !== 'object') return o;
  const txt = ['name', 'desc', 'note', 'ref', 'phone', 'email', 'label', 'company', 'code', 'symbol', 'by'];
  const walk = (arr) => (Array.isArray(arr) ? arr : []).map(item => {
    if (!item || typeof item !== 'object') return item;
    txt.forEach(k => { if (typeof item[k] === 'string') item[k] = secCleanText(item[k]); });
    // منع مفاتيح/أنواع غريبة تُستخدم لاحقاً كمعرّفات في data-*
    if (item.id != null) item.id = secCleanText(item.id).slice(0, 80);
    return item;
  });
  ['txns', 'accounts', 'contacts', 'categories', 'currencies', 'users', 'trash'].forEach(k => {
    if (Array.isArray(o[k])) o[k] = walk(o[k]);
  });
  if (o.settings && typeof o.settings === 'object' && typeof o.settings.company === 'string') {
    o.settings.company = secCleanText(o.settings.company);
  }
  if (Array.isArray(o.audit)) {
    o.audit = o.audit.slice(-3000).map(a => {
      if (!a || typeof a !== 'object') return a;
      if (typeof a.desc === 'string') a.desc = secCleanText(a.desc);
      if (typeof a.user === 'string') a.user = secCleanText(a.user);
      return a;
    });
  }
  return o;
}

/* ---------- تشفير النسخ الاحتياطية (AES-GCM 256) ---------- */
async function secEncryptPayload(obj, pass) {
  if (!SEC_SUBTLE) throw new Error('التشفير غير متاح في هذا السياق — نزّل الملف وافتحه في المتصفح مباشرة');
  const salt = secBytes(16), iv = secBytes(12);
  const key = await secPbkdf2Key(pass, salt, BACKUP_ITER);
  const plain = secUtf8(JSON.stringify(obj));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, plain);
  return {
    format: ENC_FORMAT, alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: BACKUP_ITER,
    salt: secB64(salt), iv: secB64(iv), data: secB64(ct),
    at: new Date().toISOString(), txns: (obj.txns || []).length
  };
}
async function secDecryptPayload(wrap, pass) {
  if (!SEC_SUBTLE) throw new Error('فك التشفير غير متاح في هذا السياق');
  if (!wrap || wrap.format !== ENC_FORMAT) throw new Error('ملف غير معروف');
  const salt = secUnb64(wrap.salt), iv = secUnb64(wrap.iv);
  const key = await secPbkdf2Key(pass, salt, +wrap.iter || BACKUP_ITER);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, secUnb64(wrap.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function secIsEncrypted(obj) { return !!(obj && obj.format === ENC_FORMAT); }

function secApplyImported(obj) {

  const bytes = JSON.stringify(obj).length;
  if (bytes > 40 * 1024 * 1024) { toast('الملف كبير جداً (أكثر من 40 ميجابايت)', 'err'); return false; }
  const rcptArr = Array.isArray(obj.receipts) ? obj.receipts.slice() : null;  // صور الإشعارات

  obj = secSanitizeDoc(obj);
  saveSnapshot('قبل الاستيراد');
  const keepPw = S.settings.pw, keepAuto = S.settings.autoLock, keepSec = S.settings.security;
  S = migrate(obj);
  S.settings.pw = keepPw;
  S.settings.autoLock = keepAuto;
  S.settings.security = keepSec;      // عدّاد التخمين يخصّ هذا الجهاز
  logAct('import', 'استيراد نسخة احتياطية (' + (obj.txns || []).length + ' معاملة)');

    });

  setView('dashboard');
  const rep = integrityReport();
  if (rep.problems.length) setTimeout(() => integrityModal(), 500);
  return true;
}


/* =========================================================
   تشفير البيانات على الجهاز (at-rest encryption)
   يحمي البيانات المخزّنة في المتصفح (localStorage) بحيث لا تُقرأ
   إلا بعبارة المرور — حتى لو أخذ أحدهم ملف المتصفح أو نسخه.
   AES-GCM 256 + PBKDF2-SHA256، بلا أي مكتبة خارجية.
   ========================================================= */

var CRYPT_HDR_KEY = 'hisabat_crypt_v1';     // ترويسة عامة (ملح + عدّاد محاولات) — ليست بيانات
var AT_REST_FORMAT = 'hisabat-at-rest-v1';
var CRYPT_ITER = 310000;

var CRYPT_KEY = null;        // مفتاح AES في الذاكرة فقط (لا يُخزَّن أبداً)
var CRYPT_PENDING = null;    // آخر حالة تنتظر الكتابة المشفّرة
var CRYPT_WRITING = false;
var CRYPT_FAILS = 0;

/* ---------- ترويسة التشفير ---------- */
function cryptHeader() {
  try {
    const raw = localStorage.getItem(CRYPT_HDR_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    return o && o.v === 1 && o.salt ? o : null;
  } catch (e) { return null; }
}
function cryptEnabled() { return !!cryptHeader(); }
function cryptWriteHeader(h) {
  try { localStorage.setItem(CRYPT_HDR_KEY, JSON.stringify(h)); return true; } catch (e) { return false; }
}
function cryptClearHeader() { try { localStorage.removeItem(CRYPT_HDR_KEY); } catch (e) {} }
function cryptLocked() { return cryptEnabled() && !CRYPT_KEY; }
function cryptLockoutLeft() {
  const h = cryptHeader();
  if (!h || !h.until) return 0;
  return Math.max(0, Math.ceil((h.until - Date.now()) / 1000));
}

/* ---------- اشتقاق المفتاح ---------- */
async function cryptDerive(pass, saltB64, iter) {
  return secPbkdf2Key(pass, secUnb64(saltB64), +iter || CRYPT_ITER);
}
function cryptCheckToken() { return 'hisabat-at-rest-check'; }

async function cryptEncryptBlob(key, str) {
  const iv = secBytes(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, secUtf8(str));
  return { format: AT_REST_FORMAT, alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iv: secB64(iv), data: secB64(ct) };
}
async function cryptDecryptBlob(key, blob) {
  if (!blob || blob.format !== AT_REST_FORMAT) throw new Error('صيغة غير معروفة');
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: secUnb64(blob.iv) }, key, secUnb64(blob.data));
  return new TextDecoder().decode(plain);
}
function cryptIsBlob(o) { return !!(o && o.format === AT_REST_FORMAT); }

/* =========== 1) تفعيل التشفير =========== */
async function cryptEnable(pass) {
  if (!SEC_SUBTLE) throw new Error('التشفير يحتاج فتح الملف في متصفح حديث (لا يعمل داخل نافذة المعاينة)');
  const salt = secB64(secBytes(16));
  const key = await cryptDerive(pass, salt, CRYPT_ITER);
  const check = await cryptEncryptBlob(key, cryptCheckToken());
  // نتحقق أن المفتاح يعمل فعلاً قبل الكتابة
  const back = await cryptDecryptBlob(key, check);
  if (back !== cryptCheckToken()) throw new Error('فشل التحقق من المفتاح');
  CRYPT_KEY = key;
  // 1) نكتب الحالة الحالية مشفّرة
  const raw = JSON.stringify(S);
  const blob = await cryptEncryptBlob(key, raw);
  localStorage.setItem(LS_KEY, JSON.stringify(blob));
  // 2) لقطات جديدة مشفّرة (نحذف القديمة غير المشفّرة لئلا تبقى بيانات مقروءة)
  try {
    const old = readSnaps();
    const fresh = [];
    for (const s of old.slice(0, 3)) {
      if (cryptIsBlob(s.data)) { fresh.push(s); continue; }
      if (typeof s.data === 'string' && s.data.length < 3500000) {
        fresh.push({ meta: s.meta, data: await cryptEncryptBlob(key, s.data) });
      }
    }
    writeSnaps(fresh);
  } catch (e) {}
  // 3) الترويسة (تحتوي الملح وقيمة تحقّق)
  cryptWriteHeader({ v: 1, kdf: 'PBKDF2-SHA256', iter: CRYPT_ITER, salt: salt, check: check,
                     at: nowStamp(), fails: 0, until: 0 });
  CRYPT_FAILS = 0;
  return true;
}

/* =========== 2) إلغاء التشفير =========== */
async function cryptDisable() {
  if (cryptEnabled() && !CRYPT_KEY) throw new Error('البرنامج مقفل');
  const raw = JSON.stringify(S);
  localStorage.setItem(LS_KEY, raw);                 // نُعيد النص الصريح
  try {
    const snaps = readSnaps();
    const plain = [];
    for (const s of snaps) {
      if (cryptIsBlob(s.data)) {
        try { plain.push({ meta: s.meta, data: await cryptDecryptBlob(CRYPT_KEY, s.data) }); } catch (e) {}
      } else plain.push(s);
    }
    writeSnaps(plain);
  } catch (e) {}
  cryptClearHeader();
  return true;
}

/* =========== 3) تغيير عبارة المرور =========== */
async function cryptChangePass(newPass) {
  if (!CRYPT_KEY) throw new Error('البرنامج مقفل');
  const salt = secB64(secBytes(16));
  const key = await cryptDerive(newPass, salt, CRYPT_ITER);
  const check = await cryptEncryptBlob(key, cryptCheckToken());
  // نعيد تشفير الحالة واللقطات بالمفتاح الجديد
  const raw = JSON.stringify(S);
  const blob = await cryptEncryptBlob(key, raw);
  localStorage.setItem(LS_KEY, JSON.stringify(blob));
  try {
    const snaps = readSnaps();
    const out = [];
    for (const s of snaps) {
      if (cryptIsBlob(s.data)) {
        try {
          const plain = await cryptDecryptBlob(CRYPT_KEY, s.data);
          out.push({ meta: s.meta, data: await cryptEncryptBlob(key, plain) });
        } catch (e) {}
      } else if (typeof s.data === 'string') {
        out.push({ meta: s.meta, data: await cryptEncryptBlob(key, s.data) });
      }
    }
    writeSnaps(out);
  } catch (e) {}
  CRYPT_KEY = key;
  const h = cryptHeader() || {};
  cryptWriteHeader({ v: 1, kdf: 'PBKDF2-SHA256', iter: CRYPT_ITER, salt: salt, check: check,
                     at: nowStamp(), fails: 0, until: 0, changed: (h.changed || 0) + 1 });
  return true;
}

/* =========== 4) فتح القفل بعبارة المرور =========== */
async function cryptUnlock(pass) {
  const h = cryptHeader();
  if (!h) return { ok: true, none: true };
  const left = cryptLockoutLeft();
  if (left > 0) return { ok: false, msg: 'محاولات كثيرة — انتظر ' + left + ' ثانية' };
  try {
    const key = await cryptDerive(pass, h.salt, h.iter);
    const txt = await cryptDecryptBlob(key, h.check);
    if (txt !== cryptCheckToken()) throw new Error('bad');
    CRYPT_KEY = key;
    h.fails = 0; h.until = 0; cryptWriteHeader(h);
    CRYPT_FAILS = 0;
    return { ok: true };
  } catch (e) {
    // قفل تصاعدي: 5 ثوان، ثم 15، 30، 60، 120... بحد أقصى 10 دقائق
    h.fails = (h.fails || 0) + 1;
    const steps = [5, 15, 30, 60, 120, 300, 600];
    h.until = h.fails >= 2 ? Date.now() + (steps[Math.min(h.fails - 2, steps.length - 1)]) * 1000 : 0;
    cryptWriteHeader(h);
    CRYPT_FAILS = h.fails;
    return { ok: false, msg: 'عبارة المرور غير صحيحة — المحاولة ' + h.fails + (h.until > Date.now() ? ' (انتظر ' + Math.ceil((h.until - Date.now()) / 1000) + ' ثانية)' : '') };
  }
}

/* =========== 5) القراءة والكتابة المشفّرة =========== */
async function cryptReadStateRaw() {
  const h = cryptHeader();
  if (!h) return null;
  const raw = localStorage.getItem(LS_KEY);
  if (!raw) return null;
  let obj = null;
  try { obj = JSON.parse(raw); } catch (e) { LOAD_ISSUES.push('الملف المحفوظ غير صالح (JSON تالف)'); return null; }
  if (!cryptIsBlob(obj)) {
    // بيانات قديمة غير مشفّرة: نسمح بقراءتها (ترقية تلقائية عند أول حفظ)
    return raw;
  }
  if (!CRYPT_KEY) throw new Error('locked');
  try {
    return await cryptDecryptBlob(CRYPT_KEY, obj);
  } catch (e) {
    LOAD_ISSUES.push('تعذّر فك تشفير البيانات المحفوظة');
    return null;
  }
}

function cryptSchedule(raw) {
  CRYPT_PENDING = raw;
  if (CRYPT_WRITING) return true;
  setTimeout(cryptFlush, 0);
  return true;
}

async function cryptFlush() {
  if (!cryptEnabled() || !CRYPT_KEY) return false;
  if (CRYPT_WRITING) return false;
  CRYPT_WRITING = true;
  let ok = true;
  try {
    while (CRYPT_PENDING != null) {
      const raw = CRYPT_PENDING;
      CRYPT_PENDING = null;
      try {
        const blob = await cryptEncryptBlob(CRYPT_KEY, raw);
        localStorage.setItem(LS_KEY, JSON.stringify(blob));
      } catch (e) {
        ok = false;
        if (CRYPT_PENDING == null) CRYPT_PENDING = raw;   // نُعيد المحاولة لاحقاً
        if (!storageWarned) {
          storageWarned = true;
          try { toast('⚠️ تعذّر حفظ البيانات المشفّرة — صدّر نسخة احتياطية فوراً.', 'err'); } catch (e2) {}
        }
        break;
      }
    }
  } finally {
    CRYPT_WRITING = false;
  }
  if (!ok && CRYPT_PENDING != null) setTimeout(cryptFlush, 250);
  return ok;
}

/* يُستخدم قبل العمليات الحسّاسة (تصدير، قفل، إغلاق) لضمان كتابة آخر تعديل */
async function cryptFlushNow() {
  if (!cryptEnabled() || !CRYPT_KEY) return true;
  await cryptFlush();
  return CRYPT_PENDING == null;
}

/* تشفير نصّ جاهز (للقطات) */
async function cryptWrap(str) {
  if (!cryptEnabled()) return str;
  if (!CRYPT_KEY) throw new Error('locked');
  return await cryptEncryptBlob(CRYPT_KEY, str);
}
async function cryptUnwrap(v) {
  if (!cryptIsBlob(v)) return v;
  if (!CRYPT_KEY) throw new Error('locked');
  return await cryptDecryptBlob(CRYPT_KEY, v);
}

/* بصمة سريعة (للمقارنة فقط، ليست أمنية) */
function quickHash(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16) + ':' + str.length;
}


/* =========================================================
   وحدة السلامة: سجل تعديلات موثّق (سلسلة بصمات) + فحص سلامة
   + استعادة تلقائية من لقطة سليمة + وضع إخفاء المبالغ
   ========================================================= */

/* ---------- 1) سلسلة بصمات سجل التعديلات ---------- */
var LOAD_ISSUES = [];   // مشاكل ظهرت أثناء تحميل البيانات

function auditCanon(a) {
  return [a.at || '', a.user || '', a.role || '', a.action || '', String(a.desc || '').slice(0, 300)].join('|');
}
function auditHashFor(a, prevH) {
  return sha256(toUtf8Bytes(auditCanon(a) + '|' + (prevH || '')));
}
/* يضيف البصمة للقيد: h = hash(الحقول + بصمة القيد السابق) */
function auditSeal(entry) {
  const prevH = (S && S.auditHead) || '';
  entry.prev = prevH;
  entry.h = auditHashFor(entry, prevH);
  if (S) S.auditHead = entry.h;
  return entry;
}
/* تحقق مستقل عن ترتيب القيود (آمن مع دمج المزامنة) */
function auditVerify() {
  const list = Array.isArray(S.audit) ? S.audit : [];
  const hs = new Set(list.filter(a => a && a.h).map(a => a.h));
  const base = S.auditBase || '';
  let checked = 0, legacy = 0;
  const broken = [], orphans = [];
  list.forEach(a => {
    if (!a || !a.h) { legacy++; return; }
    checked++;
    if (auditHashFor(a, a.prev || '') !== a.h) broken.push(a);
    else if (a.prev && a.prev !== base && !hs.has(a.prev)) orphans.push(a);
  });
  return { total: list.length, checked: checked, legacy: legacy, broken: broken, orphans: orphans,
           ok: broken.length === 0 && orphans.length === 0 };
}

/* ---------- 2) فحص سلامة البيانات ---------- */
function integrityReport() {
  const problems = [], notes = [];
  ['txns', 'accounts', 'contacts', 'categories', 'currencies', 'users', 'audit', 'trash'].forEach(k => {
    if (!Array.isArray(S[k])) problems.push('قائمة «' + k + '» تالفة أو مفقودة');
  });
  const ids = new Set();
  const badDate = [], dup = [], badAmt = [];
  (Array.isArray(S.txns) ? S.txns : []).forEach(t => {
    if (!t || typeof t !== 'object') { problems.push('سجل معاملة غير صالح'); return; }
    if (!t.id) problems.push('معاملة بلا معرّف');
    else if (ids.has(t.id)) dup.push(t.id); else ids.add(t.id);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(t.date || ''))) badDate.push(t.desc || t.id);
    if (isNaN(+t.amount)) badAmt.push(t.desc || t.id);
  });
  if (dup.length) problems.push('معرّفات مكررة: ' + dup.length);
  if (badDate.length) problems.push('تواريخ غير صالحة: ' + badDate.length);
  if (badAmt.length) problems.push('مبالغ غير رقمية: ' + badAmt.length);
  const au = auditVerify();
  if (au.broken.length) problems.push('قيود سجل مُعدَّلة يدوياً: ' + au.broken.length);
  if (au.orphans.length) notes.push('قيود سجل ناقصة الأصل: ' + au.orphans.length);
  if (au.legacy) notes.push('قيود قديمة غير موثّقة (قبل تفعيل السلسلة): ' + au.legacy);
  (Array.isArray(S.accounts) ? S.accounts : []).forEach(a => {
    if (!a || !a.id) problems.push('حساب بلا معرّف');
  });
  return { problems: problems, notes: notes, audit: au,
           counts: { txns: (S.txns || []).length, accounts: (S.accounts || []).length,
                     contacts: (S.contacts || []).length, audit: (S.audit || []).length } };
}

/* ---------- 3) استعادة عند تلف البيانات ---------- */
async function loadSnapshotsValid() {
  const snaps = readSnaps();
  const out = [];
  for (let i = 0; i < snaps.length; i++) {
    const s = snaps[i];
    try {
      const plain = cryptIsBlob(s.data) ? await cryptUnwrap(s.data) : s.data;
      const o = JSON.parse(plain);
      if (o && Array.isArray(o.txns)) out.push({ i: i, meta: s.meta, txns: o.txns.length });
    } catch (e) {}
  }
  return out;
}

async function maybeOfferRecovery() {

      '<div class="small muted" style="margin-top:10px">الاستعادة تُرجع البيانات والقيود إلى لحظة اللقطة المختارة.</div>',

/* ---------- 5) بصمة كود البرنامج (كشف أي تعديل على الملف) ---------- */
var APP_SELF_HASH = '';
var HASH_SEEN_KEY = 'hisabat_codehash_v1';

async function appComputeSelfHash() {
  try {
    const parts = [];
    document.querySelectorAll('script:not([src])').forEach(sc => parts.push(sc.textContent || ''));
    const text = parts.join('\n');
    let hex = '';
    if (SEC_SUBTLE) {
      const buf = await crypto.subtle.digest('SHA-256', secUtf8(text));
      hex = secHex(buf);
    } else {
      hex = sha256(toUtf8Bytes(text));
    }
    APP_SELF_HASH = hex;
    return hex;
  } catch (e) { return ''; }
}
function appHashSeen() {
  try {
    const raw = localStorage.getItem(HASH_SEEN_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (o && typeof o === 'object' && o.hash) return o;
    return { hash: String(raw), at: '' };        // قيمة قديمة أو غير متوقعة → تُقارن كما هي
  } catch (e) {
    try { const raw = localStorage.getItem(HASH_SEEN_KEY) || ''; return raw ? { hash: raw, at: '' } : null; } catch (e2) { return null; }
  }
}
function appAcceptHash() {
  try {
    localStorage.setItem(HASH_SEEN_KEY, JSON.stringify({ hash: APP_SELF_HASH, at: nowStamp(), build: (window.APP_BUILD || {}).date || '' }));
  } catch (e) {}
  renderView();
  toast('اعتُمدت بصمة الكود الحالية ✓', 'ok');
}
function appHashChanged() {
  const seen = appHashSeen();
  if (!seen || !seen.hash) return false;
  return seen.hash !== APP_SELF_HASH;
}

function buildDateText() {

}

/* ---------- 6) تفريغ تلقائي لسلة المحذوفات ---------- */
function trashDays() {
  const d = S.settings.trashDays;
  return d === undefined ? 90 : +d;
}
function purgeTrashNow(silent) {
  const days = trashDays();
  if (!days) return 0;
  const cut = Date.now() - days * 86400000;
  const list = Array.isArray(S.trash) ? S.trash : [];
  const keep = list.filter(t => {
    const ts = t && (t.ts || Date.parse(String(t.at || '').replace(' ', 'T')));
    return isNaN(ts) || ts > cut;
  });
  const removed = list.length - keep.length;
  if (removed > 0) {
    S.trash = keep.slice(0, 300);
    // علامة زمنية للتفريغ: تمنع المزامنة من إعادة ما أُفرغ تلقائياً (نفس منطق زر «تفريغ»)
    S.trashClearedAt = Math.max(+S.trashClearedAt || 0, cut);
    logAct('settings', 'تفريغ تلقائي لسلة المحذوفات (' + removed + ' عنصر أقدم من ' + days + ' يوماً)');
    saveNow();
    if (!silent) { renderView(); toast('أُفرغ ' + removed + ' عنصر قديم من السلة', 'ok'); }
  }
  return removed;
}


/* =========================================================
   إشعارات التحويل (مرفقات المعاملات)
   - الصور تُخزَّن في IndexedDB (لا تُثقل بيانات التطبيق ولا ملف المزامنة)
   - النقل بين الأجهزة عبر Supabase Storage (مخزن خاص: hisabat_receipts)
   - جهاز واحد فقط = «الأرشيف»: يستقبل الصور ويُقرّ الاستلام
   - لا حذف من الهاتف إلا بعد إقرار الأرشيف؛ ونسخة السحابة تُحذف بعد الإقرار
   ========================================================= */

const RCPT_DB = 'hisabat_rcpt';
const RCPT_STORE = 'files';
const RCPT_BUCKET = 'hisabat_receipts';
const RCPT_ARCH_KEY = 'hisabat_rcpt_archive';
const RCPT_MAX_SIDE = 1600;      // أقصى بعد للصورة بعد الضغط
const RCPT_TARGET = 700000;      // الهدف: أقل من 700 كيلوبايت

var _rcptDB = null;
var _rcptURLs = new Map();       // ذاكرة مؤقتة لروابط العرض

/* ---------- 1) التخزين المحلي (IndexedDB) ---------- */
function rcptOpen() {
  return new Promise((res, rej) => {
    if (_rcptDB) return res(_rcptDB);
    if (typeof indexedDB === 'undefined') return rej(new Error('IndexedDB غير متاح'));
    const r = indexedDB.open(RCPT_DB, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(RCPT_STORE)) db.createObjectStore(RCPT_STORE, { keyPath: 'id' });
    };
    r.onsuccess = () => { _rcptDB = r.result; res(_rcptDB); };
    r.onerror = () => rej(r.error || new Error('تعذّر فتح التخزين'));
  });
}
async function rcptPut(id, blob, meta) {
  const db = await rcptOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(RCPT_STORE, 'readwrite');
    tx.objectStore(RCPT_STORE).put(Object.assign({ id: id, blob: blob, at: Date.now() }, meta || {}));
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function rcptGet(id) {
  const db = await rcptOpen();
  return new Promise((res) => {
    const tx = db.transaction(RCPT_STORE, 'readonly');
    const g = tx.objectStore(RCPT_STORE).get(id);
    g.onsuccess = () => res(g.result || null);
    g.onerror = () => res(null);
  });
}
async function rcptDel(id) {
  const db = await rcptOpen();
  return new Promise((res) => {
    const tx = db.transaction(RCPT_STORE, 'readwrite');
    tx.objectStore(RCPT_STORE).delete(id);
    tx.oncomplete = () => { const u = _rcptURLs.get(id); if (u) { try { URL.revokeObjectURL(u); } catch (e) {} _rcptURLs.delete(id); } res(true); };
    tx.onerror = () => res(false);
  });
}
async function rcptAll() {
  const db = await rcptOpen();
  return new Promise((res) => {
    const tx = db.transaction(RCPT_STORE, 'readonly');
    const g = tx.objectStore(RCPT_STORE).getAll();
    g.onsuccess = () => res((g.result || []).map(x => ({ id: x.id, txnId: x.txnId, size: x.size || (x.blob ? x.blob.size : 0), at: x.at })));
    g.onerror = () => res([]);
  });
}
function rcptIsArchive() {
  try { return localStorage.getItem(RCPT_ARCH_KEY) === '1'; } catch (e) { return false; }
}
function rcptSetArchive(on) {
  try { localStorage.setItem(RCPT_ARCH_KEY, on ? '1' : '0'); } catch (e) {}
  renderView();
  toast(on ? 'هذا الجهاز صار «الأرشيف» — سيستقبل إشعارات بقية الأجهزة' : 'أُلغي وضع الأرشيف على هذا الجهاز', 'ok');
}

/* ---------- 2) ضغط الصور قبل الحفظ ---------- */
async function rcptCompress(file) {
  if (!/^image\//.test(file.type || '')) throw new Error('صور فقط');
  if (file.size < 120000) return file;                 // صغيرة أصلاً — تبقى كما هي
  const url = URL.createObjectURL(file);
  let img;
  try {
    img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('تعذّر قراءة الصورة'));
      i.src = url;
    });
  } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const sc = Math.min(1, RCPT_MAX_SIDE / Math.max(w, h));
  w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  let q = 0.72;
  let out = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  while (out && out.size > RCPT_TARGET && q > 0.4) {
    q -= 0.1;
    out = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  }
  return (out && out.size) ? out : file;
}

/* ---------- 3) الإرفاق (مشترك بين النموذج والقائمة) ---------- */
async function rcptAddFiles(txnId, files, list) {
  const arr = Array.prototype.slice.call(files || []);
  if (!arr.length) return list || [];
  let added = 0, skipped = 0;
  for (const f of arr) {
    if (!/^image\//.test(f.type || '')) { skipped++; continue; }
    try {
      const blob = await rcptCompress(f);
      const id = uid();
      await rcptPut(id, blob, { txnId: txnId, size: blob.size, mime: blob.type || 'image/jpeg' });
      const meta = { id: id, s: blob.size, m: blob.type || 'image/jpeg', at: Date.now(), st: 'q', by: (CU ? CU.name : '') };
      if (Array.isArray(list)) list.push(meta);
      added++;
    } catch (e) { skipped++; }
  }
  if (added) { toast('أُضيف ' + added + ' إشعاراً ✓' + (added > 1 ? ' (صُغِّرت تلقائياً)' : ''), 'ok'); scheduleSync(1200); }
  if (skipped) toast('تُقبل الصور فقط — تُخطّي ' + skipped, 'err');
  return list;
}
async function rcptDrop(id, list) {
  const i = (list || []).findIndex(r => r.id === id);
  if (i > -1) list.splice(i, 1);
  await rcptDel(id);
  return list;
}
function rcptBadge(t) {
  const n = (t && Array.isArray(t.receipts)) ? t.receipts.length : 0;
  if (!n) return '';
  return '<button type="button" class="rcpt-badge" data-act="rcpt-view" data-id="' + esc(t.id) + '" title="إشعارات التحويل">📎 ' + n + '</button>';

/* ---------- 4) العرض ---------- */
async function rcptUrlFor(rec) {
  if (_rcptURLs.has(rec.id)) return _rcptURLs.get(rec.id);
  const row = await rcptGet(rec.id);
  if (!row || !row.blob) return null;
  const u = URL.createObjectURL(row.blob);
  _rcptURLs.set(rec.id, u);
  return u;
}
async function rcptView(txnId) {
  const t = S.txns.find(x => x.id === txnId);

  const label = { q: 'بانتظار الرفع', u: 'بانتظار الكمبيوتر', a: 'محفوظ على هذا الجهاز', x: 'محفوظ على الكمبيوتر' };

      '<figcaption class="small muted">' + esc((label[r.st] || '') + ' · ' + Math.round((+r.s || 0) / 1024) + 'KB') + '</figcaption></figure>';
  }
  html += '</div>' + '<div class="small muted" style="margin-top:10px">' + esc(t.desc || '') + ' — ' + esc(dmy(t.date)) + ' · ' + esc(fmt(t.amount) + ' ' + t.currency) + '</div>';
  modal({ title: '📎 إشعارات التحويل (' + list.length + ')', body: html, footer: '<button class="btn ghost" data-close>إغلاق</button>' });
}

/* ---------- 5) النقل عبر Supabase Storage ---------- */
function rcptBase() {
  const c = (typeof syncCfg === 'function') ? syncCfg() : null;
  if (!c || !c.url || !c.uid) return null;

/* ---------- 6) المعالجة: رفع ← تنزيل وإقرار ← حذف من المرسل ---------- */
async function rcptProcess(silent) {
  if (!rcptBase()) { if (!silent) toast('المزامنة غير مفعّلة — لا يمكن نقل الإشعارات', 'err'); return { ok: false }; }
  if (!navigator.onLine) { if (!silent) toast('لا يوجد اتصال — ستُنقل الإشعارات عند عودة الشبكة', 'err'); return { ok: false }; }
  const arch = rcptIsArchive();
  let up = 0, down = 0, cleared = 0;
  const txns = (S.txns || []).slice();
  for (const t of txns) {
    const list = Array.isArray(t.receipts) ? t.receipts : [];
    for (const r of list) {
      if (r.st === 'q') {
        const row = await rcptGet(r.id);
        if (row && row.blob) {
          if (await rcptCloudPut(t.id, r, row.blob)) { r.st = 'u'; up++; touchRec(t); }
        }
      } else if (r.st === 'u' && arch) {
        const blob = await rcptCloudGet(t.id, r);
        if (blob) {
          await rcptPut(r.id, blob, { txnId: t.id, size: blob.size, mime: blob.type || 'image/jpeg' });
          r.st = 'a'; r.at2 = Date.now(); touchRec(t); down++;
          if (await rcptCloudDel(t.id, r)) cleared++;
        }
      }
    }
  }
  if (!arch) {   // المرسل: يحذف نسخته المحلية بعد إقرار الأرشيف
    for (const t of txns) {
      for (const r of (t.receipts || [])) {
        if (r.st === 'a') {
          const row = await rcptGet(r.id);
          if (row) { await rcptDel(r.id); r.st = 'x'; touchRec(t); cleared++; }
        }
      }
    }
  }
  if (up || down || cleared) { saveNow(); scheduleSync(1000); }
  if (!silent) {
    toast((up || down || cleared)
      ? 'تم النقل ✓ رُفع ' + up + ' · استُلم ' + down + ' · أُفرغ ' + cleared
      : 'لا يوجد جديد لنقله', (up || down || cleared) ? 'ok' : 'warn');
    renderView();
  }
  return { ok: true, up: up, down: down, cleared: cleared };
}

/* ---------- 7) النسخة الاحتياطية: تضمين الإشعارات ---------- */
function blobToB64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const s = String(fr.result || ''); res(s.slice(s.indexOf(',') + 1)); };
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}
function b64ToBlob(b64, mime) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: mime || 'image/jpeg' });
}
async function rcptDumpForBackup() {
  const all = await rcptAll();
  const out = [];
  for (const m of all) {
    const row = await rcptGet(m.id);
    if (row && row.blob) out.push({ id: m.id, txnId: m.txnId, mime: row.blob.type || 'image/jpeg', b64: await blobToB64(row.blob) });
  }
  return out;
}
async function rcptRestoreFromBackup(arr) {
  if (!Array.isArray(arr) || !arr.length) return 0;
  const arch = rcptIsArchive();
  let n = 0;
  for (const it of arr) {
    if (!it || !it.id || !it.b64) continue;
    try {
      const blob = b64ToBlob(it.b64, it.mime);
      await rcptPut(it.id, blob, { txnId: it.txnId, size: blob.size, mime: it.mime || 'image/jpeg' });
      const t = (S.txns || []).find(x => x.id === it.txnId);
      const r = t && (t.receipts || []).find(y => y.id === it.id);
      if (r) { r.st = arch ? 'a' : 'q'; if (!r.s) r.s = blob.size; touchRec(t); }
      n++;
    } catch (e) {}
  }
  if (n) saveNow();
  return n;
}

/* ---------- تجزئة كلمة المرور (SHA-256 نقي، يعمل بدون إنترنت ودون مكتبات) ---------- */
function sha256(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  const mathPow = Math.pow, maxWord = mathPow(2, 32);
  let result = '';
  const words = [], asciiBitLength = ascii.length * 8;
  let hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k.length;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = asciiBitLength;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = i < 16 ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
      const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) {
    for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

function toUtf8Bytes(s) {
  let out = '';
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    if (c < 128) out += String.fromCharCode(c);
    else if (c < 2048) out += String.fromCharCode(0xC0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 65536) out += String.fromCharCode(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else out += String.fromCharCode(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return out;
}

const PW_ROUNDS = 800;
function hashPw(pw, salt) {
  let h = sha256(salt + '|' + toUtf8Bytes(pw));
  for (let i = 0; i < PW_ROUNDS; i++) h = sha256(h + salt);
  return h;
}
function newSalt() {
  let s = '';
  const chars = 'abcdef0123456789';
  for (let i = 0; i < 20; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s + Date.now().toString(36);
}

function mergeLists(local, remote, keyFn) {
  const out = Array.isArray(local) ? local.slice() : [];
  const seen = new Set(out.map(keyFn));
  (Array.isArray(remote) ? remote : []).forEach(item => {

  let changed = false;
  const lists = [['txns', idKey], ['accounts', idKey], ['contacts', idKey], ['categories', idKey],
                 ['users', idKey], ['currencies', idKey], ['audit', idKey], ['trash', idKey]];
  lists.forEach(([name, fn]) => {
    const before = (S[name] || []).length;
    const merged = mergeLists(S[name], other[name], fn);
    if (merged.length !== before) { S[name] = merged; changed = true; }
  });
  // السلة: نستبعد ما أُفرغ نهائياً وما استُعيد — وإلا رجعت المحذوفات عند دمج نسخة أقدم
  if (Array.isArray(S.trash)) {
    const cleared = Math.max(+S.trashClearedAt || 0, +other.trashClearedAt || 0);
    const res = Object.assign({}, S.restoredIds || {}, other.restoredIds || {});
    S.trash = S.trash.filter(t => {
      const push = +t.ts || 0;
      if (push <= cleared) return false;
      const orig = (t.item && t.item.id) || null;
      return !(orig && (+res[orig] || 0) > push);
    });
    if (cleared > (+S.trashClearedAt || 0)) S.trashClearedAt = cleared;
  }
  if (other.deletedIds && S.deletedIds) {
    Object.keys(other.deletedIds).forEach(k => {
      if (!(k in S.deletedIds)) { S.deletedIds[k] = other.deletedIds[k]; changed = true; }
    });
  }
  return changed;
}

function saveNow() {
  // مفتاح التشفير غير موجود (شاشة الفتح) → لا نكتب شيئاً أبداً،
  // وإلا كتبنا حالة فارغة فوق البيانات المشفّرة فأضعناها.
  if (typeof cryptEnabled === 'function' && cryptEnabled()) {
    if (!CRYPT_KEY) return false;
    if (!storageOK) return false;
    return cryptSchedule(JSON.stringify(S));
  }
  // قبل الكتابة: إن كتب تبويب آخر شيئاً منذ آخر حفظ لنا، ندمج معه بدل طمسه
  if (storageOK) {
    try {
      const mine = JSON.stringify(S);
      const disk = localStorage.getItem(LS_KEY);
      if (disk && disk !== LAST_WRITTEN && disk !== mine) {
        const mergedChanged = mergeForeignState(disk);
        if (mergedChanged) LAST_WRITTEN = '';
      }
    } catch (e) { /* متابعة عادية */ }
  }
  const raw = JSON.stringify(S);
  if (storageOK) {
    try { localStorage.setItem(LS_KEY, raw); LAST_WRITTEN = raw; return true; } catch (e) { storageOK = false; }
  }
  memoryBlob = raw;   // نُبقي البيانات في الذاكرة حتى لا تُفقد الجلسة
  if (!storageWarned) {
    storageWarned = true;
    try { toast('⚠️ تعذّر الحفظ على هذا الجهاز (الذاكرة ممتلئة أو وضع خاص) — بياناتك في الذاكرة الآن، صدّر نسخة احتياطية فوراً.', 'err'); } catch (e) {}
    try { if (typeof renderView === 'function') renderView(); } catch (e) {}
  }
  return false;
}
let saveTimer = null;
function save() {
  dirtySinceBackup++;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 250);
  if (typeof scheduleSync === 'function') scheduleSync(4000);
}

function loadState() {
  detectStorage();
  let raw = null;
  if (storageOK) { try { raw = localStorage.getItem(LS_KEY); } catch (e) { raw = null; } }
  if (!raw) raw = memoryBlob;
  if (raw) {
    let obj = null;
    try { obj = JSON.parse(raw); }
    catch (e) { console.warn('تعذر قراءة البيانات المخزنة', e); LOAD_ISSUES.push('الملف المحفوظ غير صالح (JSON تالف)'); }
    // بيانات مشفّرة على الجهاز: تُفكّ لاحقاً بعبارة المرور (انظر init)
    if (obj && cryptIsBlob(obj)) return seedState();
    if (obj && Array.isArray(obj.txns)) {
      try { return migrate(obj); }
      catch (e) {
        // لا نُسقط بيانات المستخدم: نُكمل بأقل تحويل ممكن ونحفظ تحذيراً
        console.warn('تعذر تحويل البيانات، تم التحميل بأقل تعديل', e);
        LOAD_ISSUES.push('تعذر تحويل بنية البيانات: ' + (e.message || 'خطأ'));
        obj.settings = obj.settings || {};
        obj.currencies = Array.isArray(obj.currencies) && obj.currencies.length ? obj.currencies : seedState().currencies;
        obj.accounts = obj.accounts || [];
        obj.contacts = obj.contacts || [];
        obj.categories = obj.categories || [];
        obj.users = Array.isArray(obj.users) ? obj.users : [];
        obj.audit = Array.isArray(obj.audit) ? obj.audit : [];
        obj.trash = Array.isArray(obj.trash) ? obj.trash : [];
        obj.deletedIds = obj.deletedIds || {};
        obj.restoredIds = obj.restoredIds || {};
        return obj;
      }
    }
    if (obj) {
      // JSON سليم لكن البنية غير قابلة للاستخدام (لا قائمة معاملات) — لا نُصفّر بصمت
      LOAD_ISSUES.push('البيانات المحفوظة بنيتها غير صالحة (لا تحتوي قائمة معاملات)');
    } else if (raw && !LOAD_ISSUES.length) {
      LOAD_ISSUES.push('البيانات المحفوظة فارغة أو غير قابلة للقراءة');
    }
  }
  return seedState();
}

function migrate(o) {
  o.settings = o.settings || {};
  o.currencies = o.currencies || [];
  o.accounts = o.accounts || [];
  o.contacts = o.contacts || [];
  o.categories = o.categories || [];
  o.txns = o.txns || [];
  if (!o.settings.base) o.settings.base = 'SDG';
  if (o.settings.pw === undefined) o.settings.pw = null;
  if (o.settings.autoLock === undefined) o.settings.autoLock = false;
  if (!Array.isArray(o.users)) o.users = [];
  if (!Array.isArray(o.audit)) o.audit = [];
  if (!Array.isArray(o.trash)) o.trash = [];
  if (!(+o.trashClearedAt > 0)) o.trashClearedAt = 0;   // وقت آخر تفريغ للسلة (يمنع رجوع المحذوفات بعد المزامنة)
  if (!o.deletedIds || typeof o.deletedIds !== 'object') o.deletedIds = {};
  if (!o.restoredIds || typeof o.restoredIds !== 'object') o.restoredIds = {};
  if (!o.settings.sync) o.settings.sync = null;
  if (!o.settings.security || typeof o.settings.security !== 'object') {
    o.settings.security = { fails: 0, lockUntil: 0, lastFail: 0 };
  }
  if (o.settings.autoLockMin === undefined) o.settings.autoLockMin = 5;
  if (o.settings.lockOnHide === undefined) o.settings.lockOnHide = false;
  if (o.settings.trashDays === undefined) o.settings.trashDays = 90;
  if (o.auditHead === undefined) o.auditHead = '';
  if (o.auditBase === undefined) o.auditBase = '';
  ['booksStart', 'lockUntil', 'backupFile'].forEach(k => { if (o.settings[k] === undefined) o.settings[k] = ''; });
  if (o.settings.backupDays === undefined) o.settings.backupDays = 7;
  if (o.settings.lastBackupTs === undefined) o.settings.lastBackupTs = 0;
  if (o.settings.snoozeTs === undefined) o.settings.snoozeTs = 0;
  // تحويل كلمة المرور القديمة إلى مستخدم مدير
  if (o.settings.pw && o.users.length === 0) {
    o.users.push({ id: 'u_admin', name: 'المدير', role: 'admin', salt: o.settings.pw.salt, hash: o.settings.pw.hash, created: todayISO() });
    o.settings.pw = null;
  }
  RATE_DOC = o;
  try {
    o.txns.forEach(t => {
      if (t && t.base == null) {
        try { t.base = round2((+t.amount || 0) * (rateOf(t.currency) || 1)); } catch (e) { t.base = +t.amount || 0; }
      }
    });
  } finally { RATE_DOC = null; }
  return o;
}

function curOf(code) { return S.currencies.find(c => c.code === code) || { code: code, symbol: code, rate: 1 }; }
var RATE_DOC = null;   // المستند الجاري تحويله/تحميله (قبل تهيئة S)
function rateOf(code) {
  let doc = RATE_DOC;
  if (!doc) { try { doc = S; } catch (e) { doc = null; } }
  if (!doc || !doc.settings) return 1;
  if (code === doc.settings.base) return 1;
  const c = (doc.currencies || []).find(x => x.code === code);
  return c && +c.rate > 0 ? +c.rate : 1;
}
function sym(code) { return curOf(code).symbol || code; }
function toBase(amount, code, rate) {
  const amt = +amount || 0;
  const r = (rate !== '' && rate != null && +rate > 0) ? +rate : rateOf(code);
  return round2(amt * r);
}
function money(n, code) {
  const c = code || S.settings.base;
  return fmt(n) + ' ' + sym(c);
}

/* تغيير العملة الأساسية: نُعيد كتابة الأسعار وكل القيم الأساسية
   بحيث تبقى القيمة الحقيقية للمبالغ كما هي (بدل أن تتغيّر أرقامها فقط). */
function changeBaseCurrency(newCode) {
  const oldBase = S.settings.base;
  if (!newCode || newCode === oldBase) return false;
  const perNew = rateOf(newCode);                 // كم من العملة القديمة يساوي 1 من الجديدة
  if (!(perNew > 0) || !isFinite(perNew)) return false;
  const r8 = v => Math.round(v * 1e8) / 1e8;
  const exact = {};                                // أسعار بدقة كاملة قبل أي تقريب
  S.currencies.forEach(c => { exact[c.code] = (+c.rate > 0 ? +c.rate : 1) / perNew; });
  exact[newCode] = 1;
  // الأسعار: تُصبح معبَّرة مقابل العملة الجديدة
  S.currencies.forEach(c => { c.rate = r8(exact[c.code] || 1); });
  S.settings.base = newCode;
  // كل معاملة: نُعيد حساب قيمتها بالعملة الجديدة من المبلغ والعملة نفسها
  S.txns.forEach(t => {
    const r = exact[t.currency] != null ? exact[t.currency] : 1;
    t.rate = r8(r);
    t.base = round2((+t.amount || 0) * r);
  });
  touchSettings();
  return true;
}

function accName(id) { const a = S.accounts.find(x => x.id === id); return a ? a.name : '—'; }
function catName(id) { const c = S.categories.find(x => x.id === id); return c ? c.name : ''; }
function contactName(id) { const c = S.contacts.find(x => x.id === id); return c ? c.name : ''; }

function accountBalance(accId) {
  const a = S.accounts.find(x => x.id === accId);
  if (!a) return 0;
  let bal = toBase(a.opening || 0, a.currency);
  for (const t of S.txns) {
    const amt = t.base != null ? +t.base : toBase(t.amount, t.currency);
    if (t.kind === 'income' && t.account === accId) bal += amt;
    else if (t.kind === 'expense' && t.account === accId) bal -= amt;
    else if (t.kind === 'transfer') {
      if (t.account === accId) bal -= amt;
      if (t.toAccount === accId) bal += amt;
    }
  }
  return round2(bal);
}

function accountBalanceAt(accId, date) {
  const a = S.accounts.find(x => x.id === accId);
  if (!a) return 0;
  let bal = 0;
  if (!S.settings.booksStart || date >= S.settings.booksStart) bal += toBase(a.opening || 0, a.currency);
  for (const t of S.txns) {
    if (!t.date || t.date > date) continue;
    const amt = t.base != null ? +t.base : toBase(t.amount, t.currency);
    if (t.kind === 'income' && t.account === accId) bal += amt;
    else if (t.kind === 'expense' && t.account === accId) bal -= amt;
    else if (t.kind === 'transfer') {
      if (t.account === accId) bal -= amt;
      if (t.toAccount === accId) bal += amt;
    }
  }
  return round2(bal);
}

function contactBalance(id) {
  const c = S.contacts.find(x => x.id === id);
  if (!c) return 0;
  let bal = +c.opening || 0;
  for (const t of S.txns) {
    if (t.contact !== id) continue;
    const amt = t.base != null ? +t.base : toBase(t.amount, t.currency);
    if (t.kind === 'income') bal += amt;
    else if (t.kind === 'expense') bal -= amt;
  }
  return round2(bal);
}

function totals(list) {
  let income = 0, expense = 0, transfer = 0;
  (list || S.txns).forEach(t => {
    const amt = t.base != null ? +t.base : toBase(t.amount, t.currency);
    if (t.kind === 'income') income += amt;
    else if (t.kind === 'expense') expense += amt;
    else transfer += amt;
  });
  return { income: round2(income), expense: round2(expense), net: round2(income - expense), transfer: round2(transfer) };
}

function totalBalances() {
  return round2(S.accounts.reduce((s, a) => s + accountBalance(a.id), 0));
}

let modalSeq = 0;
function modal(opts) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  // حارس النقر المزدوج: النقرة الثانية على «حفظ/موافق» خلال 700ms تُهمَل
  wrap.addEventListener('click', e => {
    const b = e.target && e.target.closest ? e.target.closest('[data-save],[data-ok],[data-import]') : null;
    if (!b) return;
    if (wrap.dataset.busy === '1') { e.preventDefault(); e.stopImmediatePropagation(); return; }
    wrap.dataset.busy = '1';
    setTimeout(() => { delete wrap.dataset.busy; }, 700);
  }, true);
  wrap.innerHTML =
    '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modalTitle-' + modalSeq + '">' +
      '<div class="modal-head"><h3 id="modalTitle-' + (++modalSeq) + '">' + esc(opts.title || '') + '</h3>' +
        '<button class="icon-btn" data-close title="إغلاق">✕</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer === false ? '' : '<div class="modal-foot">' + (opts.footer || '<button class="btn ghost" data-close>إغلاق</button>') + '</div>') +
    '</div>';
  document.body.appendChild(wrap);
  const close = () => { wrap.remove(); if (opts.onClose) opts.onClose(); };
  wrap.addEventListener('click', e => {
    if (e.target === wrap || e.target.closest('[data-close]')) close();
  });
  const esc2 = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc2); } };
  document.addEventListener('keydown', esc2);
  if (opts.after) opts.after(wrap, close);
  const fi = wrap.querySelector('input,select,textarea');
  if (fi && !('ontouchstart' in window)) setTimeout(() => fi.focus(), 60);
  return { wrap, close };
}

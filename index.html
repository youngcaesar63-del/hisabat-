function touchRec(rec) { if (rec) rec.updatedAt = Date.now(); return rec; }
function markDeleted(id) {
  if (!id) return;
  if (!S.deletedIds) S.deletedIds = {};
  S.deletedIds[id] = Date.now();
}
function markRestored(id) {
  if (!id) return;
  if (!S.restoredIds) S.restoredIds = {};
  S.restoredIds[id] = Date.now();
  if (S.deletedIds) delete S.deletedIds[id];
}
function touchSettings() { if (!S.settings.updatedAt) S.settings.updatedAt = 0; S.settings.updatedAt = Date.now(); }

/* ---------- سلة المحذوفات ---------- */
const TRASH_NAMES = { txn: 'معاملة', account: 'حساب', contact: 'طرف', category: 'بند' };
function pushTrash(type, item, label) {
  if (!Array.isArray(S.trash)) S.trash = [];
  S.trash.unshift({ id: uid(), type: type, at: nowStamp(), ts: Date.now(), by: CU ? CU.name : '', label: label, item: item });
  if (S.trash.length > 300) S.trash = S.trash.slice(0, 300);
}
function restoreTrash(id) {
  const idx = S.trash.findIndex(t => t.id === id);
  if (idx === -1) return;
  const t = S.trash[idx];
  const coll = { txn: S.txns, account: S.accounts, contact: S.contacts, category: S.categories }[t.type];
  if (!coll) return;
  if (!coll.some(x => x.id === t.item.id)) { touchRec(t.item); coll.push(t.item); }
  markRestored(t.item.id);
  S.trash.splice(idx, 1);
  logAct('add', 'استرجاع ' + (TRASH_NAMES[t.type] || '') + ': ' + t.label);
  saveNow(); renderView(); toast('تم الاسترجاع ✓', 'ok');
}

/* ---------- النسخ الاحتياطية الداخلية (لقطات) ---------- */
const SNAP_KEY = 'hisabat_snapshots_v1';
function readSnaps() {
  try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]') || []; } catch (e) { return []; }
}
function writeSnaps(arr) {
  if (typeof cryptEnabled === 'function' && cryptEnabled() && !CRYPT_KEY) return false;  // مقفل
  try { localStorage.setItem(SNAP_KEY, JSON.stringify(arr.slice(0, 3))); return true; } catch (e) { return false; }
}
async function saveSnapshot(reason) {
  if (!storageOK) return false;
  const raw = JSON.stringify(S);
  if (raw.length > 3500000) return false;
  const snaps = readSnaps();
  const meta = { at: nowStamp(), reason: reason || 'تلقائي', txns: S.txns.length, accounts: S.accounts.length,
                 size: Math.round(raw.length / 1024), h: quickHash(raw) };
  const prevPlain = !cryptIsBlob((snaps[0] || {}).data) ? (snaps[0] || {}).data : null;
  if (prevPlain === raw) return true;
  if (snaps[0] && snaps[0].meta && snaps[0].meta.h === meta.h) { snaps[0].meta.at = nowStamp(); return writeSnaps(snaps); }
  let data = raw;
  try { data = await cryptWrap(raw); } catch (e) { return false; }
  snaps.unshift({ meta: meta, data: data });
  return writeSnaps(snaps);
}
async function snapshotIfChanged(reason) {
  // لا نأخذ لقطة والحالة مشكوك فيها (تلف/استعادة) حتى لا نطمس اللقطات السليمة
  if (typeof LOAD_ISSUES !== 'undefined' && LOAD_ISSUES.length) return false;
  if (cryptLocked()) return false;
  return saveSnapshot(reason);
}
async function restoreSnapshot(i) {
  const snaps = readSnaps();
  const snap = snaps[i];
  if (!snap) return;
  try {
    const plain = cryptIsBlob(snap.data) ? await cryptUnwrap(snap.data) : snap.data;
    const obj = JSON.parse(plain);
    S = migrate(obj);
    saveNow();
    toast('تمت الاستعادة إلى نسخة ' + snap.meta.at, 'ok');
    setTimeout(() => location.reload(), 600);
  } catch (e) {
    toast('تعذرت الاستعادة', 'err');
  }
}

/* ---------- IndexedDB لحفظ مقبض الملف ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('hisabat_db', 1);
    r.onupgradeneeded = () => { try { r.result.createObjectStore('kv'); } catch (e) {} };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) {
  try {
    const db = await idbOpen();
    return new Promise(res => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    });
  } catch (e) { return false; }
}
async function idbGet(k) {
  try {
    const db = await idbOpen();
    return new Promise(res => {
      const tx = db.transaction('kv', 'readonly');
      const q = tx.objectStore('kv').get(k);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}

/* ---------- النسخ الاحتياطي إلى ملف على الجهاز ---------- */
let backupHandle = null;
let dirtySinceBackup = 0;
const FS_SUPPORTED = !!(window.showSaveFilePicker);

async function pickBackupFile() {
  if (!FS_SUPPORTED) { toast('المتصفح لا يدعم ربط ملف — استخدم زر تنزيل النسخة', 'err'); return; }
  try {
    const h = await window.showSaveFilePicker({
      suggestedName: 'حسابات-نسخة-احتياطية.json',
      types: [{ description: 'نسخة احتياطية JSON', accept: { 'application/json': ['.json'] } }]
    });
    backupHandle = h;
    await idbSet('backupHandle', h);
    S.settings.backupFile = h.name || 'ملف النسخة';
    const ok = await writeBackupFile('ربط ملف');
    saveNow(); renderView();
    toast(ok ? 'تم ربط الملف — ستُحدَّث النسخة تلقائياً ✓' : 'تم الربط، لكن تعذّرت الكتابة', ok ? 'ok' : 'err');
  } catch (e) {
    if (e && (e.name === 'AbortError' || e.name === 'NotAllowedError')) return;
    toast('تعذر ربط الملف', 'err');
  }
}

async function writeBackupFile(reason) {
  if (!backupHandle) return false;
  try {
    let perm = await backupHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') perm = await backupHandle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') return false;
    const w = await backupHandle.createWritable();
    await w.write(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    await w.close();
    S.settings.lastBackupTs = Date.now();
    S.settings.backupFile = backupHandle.name || S.settings.backupFile;
    dirtySinceBackup = 0;
    saveNow();
    return true;
  } catch (e) {
    return false;
  }
}

async function initBackupHandle() {
  if (!FS_SUPPORTED || !storageOK) return;
  const h = await idbGet('backupHandle');
  if (!h) return;
  backupHandle = h;
  S.settings.backupFile = h.name || S.settings.backupFile;
  try {
    const perm = await h.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      const ok = await writeBackupFile('تحديث عند الفتح');
      if (ok) toast('تم تحديث نسخة الملف: ' + (h.name || ''), 'ok');
    }
  } catch (e) {}
}

function unlinkBackupFile() {
  backupHandle = null;
  idbSet('backupHandle', null);
  S.settings.backupFile = '';
  saveNow(); renderView();
  toast('تم فصل الملف', 'ok');
}

function backupDue() {
  if (!S.txns.length) return false;
  if (S.settings.snoozeTs && Date.now() - S.settings.snoozeTs < 3 * 86400000) return false;
  const ts = S.settings.lastBackupTs || 0;
  if (!ts) return true;
  return (Date.now() - ts) > (S.settings.backupDays || 7) * 86400000;
}

      if (!b) return;
      selected = b.dataset.uid;
      $$('.user-chip', pick).forEach(x => x.classList.toggle('active', x === b));
      $('#loginPw').focus();
    });
  }

  const form = $('#loginForm');
  const input = $('#loginPw');
  // قفل تصاعدي محفوظ: لا يُصفَّر بإعادة تحميل الصفحة
  const left0 = secLockLeft();
  if (left0 > 0) {
    const btn0 = $('#loginBtn');

    $('#lockErr').textContent = '🔒 محاولات كثيرة — انتظر ' + left0 + ' ثانية';
    const tick = setInterval(() => {
      const l = secLockLeft();
      if (l <= 0) { clearInterval(tick); btn0.disabled = false; btn0.textContent = 'دخول'; $('#lockErr').textContent = ''; }
      else { $('#lockErr').textContent = '🔒 محاولات كثيرة — انتظر ' + l + ' ثانية'; }
    }, 1000);

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#loginBtn');
    if (btn.disabled) return;
    const wait = secLockLeft();
    if (wait > 0) { $('#lockErr').textContent = '🔒 محاولات كثيرة — انتظر ' + wait + ' ثانية'; return; }
    const u = S.users.find(x => x.id === selected);
    const ok = u && u.active !== false && await secVerifyPw(input.value, u);
    if (ok) {
      CU = { id: u.id, name: u.name, role: u.role };
      pwFails = 0;
      lastActivity = Date.now();

      try {
        if (await secUpgradePw(u, input.value)) { saveNow(); logAct('user', 'ترقية تشفير كلمة المرور (PBKDF2)'); }
      } catch (err) {}

      pwFails++;
      const r = secOnFail(u ? u.name : '');
      input.value = '';
      input.focus();
      if (r.mins) {
        btn.disabled = true;
        btn.textContent = 'مقفل مؤقتاً';
        $('#lockErr').textContent = '🔒 ' + r.fails + ' محاولات فاشلة — انتظر ' + r.mins + ' دقيقة';

          if (l <= 0) { clearInterval(tick); btn.disabled = false; btn.textContent = 'دخول'; $('#lockErr').textContent = ''; }

        btn.disabled = true;
        const wait = Math.min(30, 3 * r.fails);
        btn.textContent = 'الانتظار ' + wait + ' ثانية…';
        setTimeout(() => { btn.disabled = false; btn.textContent = 'دخول'; }, wait * 1000);
      }
    }
  });
  setTimeout(() => { const i = $('#loginPw'); if (i) i.focus(); }, 120);
}

  if (left > 0) { input.disabled = true; btn.disabled = true; err.textContent = 'محاولات كثيرة — انتظر ' + left + ' ثانية'; }
  setTimeout(() => { if (!input.disabled) input.focus(); }, 80);
  form.addEventListener('submit', async e => {

    input.value = '';
    await bootApp();          // نُكمل الإقلاع بعد فك التشفير
  });

async function bootApp() {
  if (!bootApp.tabsBound) { bootApp.tabsBound = true; bindTabSync(); }
  // 1) نقرأ البيانات المفكوكة ونستبدل الحالة الحالية
  if (cryptEnabled()) {
    let raw = null;
    try { raw = await cryptReadStateRaw(); } catch (e) { raw = null; }
    if (raw) {
      try {
        const obj = JSON.parse(raw);
        if (obj && Array.isArray(obj.txns)) { S = migrate(obj); memoryBlob = raw; }
      } catch (e) { LOAD_ISSUES.push('تعذّر قراءة البيانات بعد فك التشفير'); }
    }
  }
  document.documentElement.setAttribute('data-theme', S.settings.theme === 'dark' ? 'dark' : 'light');
  MASK_MODE = (function () { try { return localStorage.getItem('hisabat_priv') === '1'; } catch (e) { return false; } })();
  if (needLogin()) renderLogin();
  else render();
  try { await snapshotIfChanged('فتح البرنامج'); } catch (e) {}
  setTimeout(() => { try { initBackupHandle(); } catch (e) {} }, 400);
  setTimeout(() => { try { maybeOfferRecovery(); } catch (e) {} }, 700);
  try { appComputeSelfHash().then(() => { if (ui.view === 'settings') renderView(); }); } catch (e) {}
  try { purgeTrashNow(true); } catch (e) {}
  if (!bootApp.once) {
    bootApp.once = true;
    setInterval(() => { if (backupHandle && dirtySinceBackup > 0) writeBackupFile('تحديث تلقائي'); }, 3 * 60 * 1000);
    setInterval(() => { try { purgeTrashNow(true); } catch (e) {} }, 6 * 60 * 60 * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && backupHandle && dirtySinceBackup > 0) writeBackupFile('عند مغادرة الصفحة');
      if (document.hidden && S.settings.lockOnHide && CU) lockNow(true);
    });
    if (!storageOK) setTimeout(() => toast('وضع المعاينة: الحفظ الدائم غير متاح — حمّل الملف وافتحه في المتصفح', 'err'), 600);
  }
}

/* =========================================================
   لوحة التحكم
   ========================================================= */
function periodRange(kind) {
  const d = new Date();
  const y = d.getFullYear();
  if (kind === 'month') return [y + '-' + pad2(d.getMonth() + 1) + '-01', todayISO()];
  if (kind === 'today') return [todayISO(), todayISO()];
  if (kind === 'year') return [y + '-01-01', todayISO()];
  if (kind === 'all') return ['', ''];
  const back = new Date();
  back.setDate(back.getDate() - 29);
  return [back.getFullYear() + '-' + pad2(back.getMonth() + 1) + '-' + pad2(back.getDate()), todayISO()];
}

function lastMonths(n) {
  const out = [];
  const d = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(x.getFullYear() + '-' + pad2(x.getMonth() + 1));
  }
  return out;
}

function monthlyData(months) {
  return months.map(mk => {
    const t = totals(S.txns.filter(t => (t.date || '').slice(0, 7) === mk));
    return { key: mk, income: t.income, expense: t.expense, net: t.net };
  });
}

function chartSVG(months, data) {
  const W = 620, H = 200, padB = 26, padT = 12, padX = 10;
  const max = Math.max(1, ...data.map(d => Math.max(d.income, d.expense)));
  const innerH = H - padB - padT;
  const groupW = (W - padX * 2) / Math.max(1, months.length);
  const barW = Math.min(24, Math.max(8, groupW / 3.4));
  let out = '';
  for (let g = 1; g <= 3; g++) {
    const y = padT + innerH - (innerH * g / 3);
    out += '<line class="grid-line" x1="0" y1="' + y.toFixed(1) + '" x2="' + W + '" y2="' + y.toFixed(1) + '"/>';
  }
  data.forEach((d, i) => {
    const cx = padX + groupW * i + groupW / 2;
    const hi = innerH * (d.income / max);
    const ho = innerH * (d.expense / max);
    out += '<rect class="bar-in" x="' + (cx - barW - 1.5).toFixed(1) + '" y="' + (padT + innerH - hi).toFixed(1) +
      '" width="' + barW.toFixed(1) + '" height="' + Math.max(hi, 1).toFixed(1) + '" rx="3"><title>' + esc(monthLabel(d.key)) + ' — وارد: ' + fmt(d.income) + '</title></rect>';
    out += '<rect class="bar-out" x="' + (cx + 1.5).toFixed(1) + '" y="' + (padT + innerH - ho).toFixed(1) +
      '" width="' + barW.toFixed(1) + '" height="' + Math.max(ho, 1).toFixed(1) + '" rx="3"><title>' + esc(monthLabel(d.key)) + ' — منصرف: ' + fmt(d.expense) + '</title></rect>';
    out += '<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(monthShort(d.key)) + '</text>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">' + out + '</svg>';
}

/* =========================================================
   المعاملات
   ========================================================= */
function txnMatches(t, f) {
  if (f.kind && t.kind !== f.kind) return false;
  if (f.account && t.account !== f.account && t.toAccount !== f.account) return false;
  if (f.contact && t.contact !== f.contact) return false;
  if (!inRange(t.date, f.from, f.to)) return false;
  if (f.q) {
    const hay = [t.desc, t.note, t.ref, t.method, catName(t.category), contactName(t.contact), accName(t.account), accName(t.toAccount), t.amount, t.amount2]
      .join(' ').toLowerCase();
    if (hay.indexOf(f.q.toLowerCase()) === -1) return false;
  }
  return true;
}

function filteredTxns() {
  if (!(ui.txn.limit > 0)) ui.txn.limit = TXN_PAGE;
  return S.txns.filter(t => txnMatches(t, ui.txn))
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || 0) - (a.created || 0));
}

function txnBadge(kind) {
  if (kind === 'income') return '<span class="badge in">وارد</span>';
  if (kind === 'expense') return '<span class="badge out">منصرف</span>';
  return '<span class="badge tr">تحويل</span>';
}

function txnRow(t, compact) {
  const amt = t.base != null ? +t.base : toBase(t.amount, t.currency);
  const sign = t.kind === 'income' ? '+' : t.kind === 'expense' ? '−' : '';
  const color = t.kind === 'income' ? 'var(--in)' : t.kind === 'expense' ? 'var(--out)' : 'var(--tr)';
  const desc = t.desc || catName(t.category) || (t.kind === 'transfer' ? 'تحويل بين الحسابات' : '—');
  const acc = t.kind === 'transfer' ? accName(t.account) + ' ← ' + accName(t.toAccount) : accName(t.account);

    '<td class="c-type">' + txnBadge(t.kind) + '</td>' +
    '<td class="c-desc"><b>' + esc(desc) + '</b>' + rcptBadge(t) +
      (catName(t.category) && t.desc ? '<div class="small muted">' + esc(catName(t.category)) + '</div>' : '') +
      (t.contact ? '<div class="small muted">' + esc(contactName(t.contact)) + '</div>' : '') + '</td>' +
    (compact ? '' : '<td class="small hide-sm c-acc">' + esc(acc) + '</td>') +
    '<td class="num nowrap c-amt" style="color:' + color + ';font-weight:700">' + sign + fmt(t.amount) +
      ' <span class="small muted">' + esc(t.currency) + '</span></td>' +

    (compact ? '' :
      '<td class="no-print nowrap c-acts">' +
        '<button class="icon-btn" data-act="txn-edit" data-id="' + t.id + '" title="تعديل">✏️</button>' +
        '<button class="icon-btn" data-act="txn-del" data-id="' + t.id + '" title="حذف">🗑️</button>' +
      '</td>') +

}

/* ---------- نموذج المعاملة ---------- */
function txnForm(id) {
  const isNew = !id;
  const t = isNew
    ? { date: todayISO(), kind: 'expense', account: (S.accounts[0] || {}).id, currency: S.settings.base, method: 'نقداً', amount: '' }
    : S.txns.find(x => x.id === id);
  if (!t) return;
  _rcptFormTxn = isNew ? uid() : t.id;
  _rcptPending = Array.isArray(t.receipts) ? t.receipts.slice() : [];

  const kind = t.kind || 'expense';
  const body =
    '<div class="seg" id="kindSeg" style="margin-bottom:14px;width:100%">' +
      ['income', 'expense', 'transfer'].map(k =>
        '<button type="button" data-k="' + k + '" class="' + (kind === k ? 'active' : '') + '" style="flex:1">' +
        ({ income: '⬇️ وارد', expense: '⬆️ منصرف', transfer: '🔄 تحويل' })[k] + '</button>').join('') +
    '</div>' +
    '<div class="form-grid">' +
      '<div class="field"><label>التاريخ *</label><input type="date" id="tDate" value="' + esc(t.date || todayISO()) + '"></div>' +
      '<div class="field"><label>المبلغ *</label>' +
        '<input type="text" inputmode="decimal" autocomplete="off" class="money" id="tAmount" value="' +
          esc(t.amount === undefined || t.amount === '' ? '' : fmtInput(String(t.amount))) + '" placeholder="0.00">' +
        '<span class="hint">أرقام فقط — مثال: 150,000 أو 1500.50 (تُقبل الأرقام العربية)</span></div>' +
      '<div class="field"><label>العملة</label><select id="tCur">' + optCurrencies(t.currency || S.settings.base) + '</select></div>' +
      '<div class="field" id="rateField"><label>سعر التحويل مقابل ' + esc(S.settings.base) + '</label>' +
        '<input type="number" step="0.0001" min="0" id="tRate" value="' + esc(t.rate != null ? t.rate : rateOf(t.currency || S.settings.base)) + '">' +
        '<span class="hint" id="rateHint">المعادل: 0</span></div>' +
      (S.accounts.length ? '' :
        '<div class="notice" style="grid-column:1/-1">⚠️ <div>لا يوجد أي حساب بعد. أضف حساباً (صندوق أو بنك) أولاً لتتمكن من تسجيل المعاملة.' +
        ' <button class="btn ghost sm" style="margin-inline-start:8px" data-act="acc-new-quick">➕ إضافة حساب</button></div></div>') +
      '<div class="field"><label id="accLabel">الحساب / الصندوق *</label><select id="tAcc">' + optAccounts(t.account) + '</select></div>' +
      '<div class="field" id="toAccField"><label>إلى حساب *</label><select id="tToAcc">' + optAccounts(t.toAccount) + '</select></div>' +
      '<div class="field" id="catField"><label>البند</label><select id="tCat"><option value="">— بدون —</option>' + optCategories(kind, t.category) + '</select></div>' +
      '<div class="field" id="contactField"><label>الطرف (عميل/مورد)</label><select id="tContact">' + optContacts(t.contact) + '</select>' +
        '<span class="hint"><a href="#" data-act="quick-contact">+ إضافة طرف جديد</a></span></div>' +
      '<div class="field"><label>طريقة الدفع</label><select id="tMethod">' +
        ['نقداً', 'بنك', 'شيك', 'محفظة إلكترونية', 'آجل', 'أخرى'].map(m =>
          '<option' + (t.method === m ? ' selected' : '') + '>' + m + '</option>').join('') +
      '</select></div>' +
      '<div class="field"><label>رقم المستند / المرجع</label><input type="text" id="tRef" value="' + esc(t.ref || '') + '" placeholder="مثال: INV-1024"></div>' +
      '<div class="field full"><label>البيان / الوصف</label><input type="text" id="tDesc" value="' + esc(t.desc || '') + '" placeholder="مثال: مبيعات يوم الأحد"></div>' +
      '<div class="field full"><label>ملاحظات</label><textarea id="tNote">' + esc(t.note || '') + '</textarea></div>' +
    '</div>' +
    rcptFormBoxHtml() +
    '<div id="tErr" style="color:var(--out);font-size:13px;margin-top:10px"></div>' +
    (!isNew && (t.createdBy || t.updatedBy)
      ? '<div class="small muted" style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">' +
        (t.createdBy ? 'أُضيفت بواسطة: <b>' + esc(t.createdBy) + '</b>' : '') +
        (t.updatedBy ? ' · آخر تعديل: <b>' + esc(t.updatedBy) + '</b> (' + esc(t.updatedAt || '') + ')' : '') + '</div>'
      : '');

  const m = modal({
    title: isNew ? 'إضافة معاملة' : 'تعديل معاملة',
    body: body,
    footer: '<button class="btn" data-save>💾 حفظ</button>' +
      (isNew ? '<button class="btn ghost" data-save-new>حفظ وإضافة أخرى</button>' : '') +
      '<button class="btn ghost" data-close>إلغاء</button>',
    after: (wrap, close) => {
      let curKind = kind;
      const $id = q => wrap.querySelector(q);

      function refreshKind() {
        $$('#kindSeg button', wrap).forEach(b => b.classList.toggle('active', b.dataset.k === curKind));
        $id('#catField').style.display = curKind === 'transfer' ? 'none' : '';
        $id('#contactField').style.display = curKind === 'transfer' ? 'none' : '';
        $id('#toAccField').style.display = curKind === 'transfer' ? '' : 'none';
        $id('#accLabel').textContent = curKind === 'transfer' ? 'من حساب *' : 'الحساب / الصندوق *';
        const cat = $id('#tCat');
        const keep = cat.value;
        cat.innerHTML = '<option value="">— بدون —</option>' + optCategories(curKind, '');
        if ([...cat.options].some(o => o.value === keep)) cat.value = keep;
      }

      function refreshConversion() {
        const cur = $id('#tCur').value;
        const isBase = cur === S.settings.base;
        $id('#rateField').style.display = isBase ? 'none' : '';
        const rate = isBase ? 1 : (+$id('#tRate').value || rateOf(cur));
        const amt = parseAmount($id('#tAmount').value);
        $id('#rateHint').textContent = 'المعادل: ' + fmt(round2(amt * rate)) + ' ' + S.settings.base;
      }

      wireMoneyInput($id('#tAmount'), refreshConversion);

      $('#kindSeg', wrap).addEventListener('click', e => {
        const b = e.target.closest('button[data-k]');
        if (!b) return;
        curKind = b.dataset.k;
        refreshKind();
      });
      ['#tCur', '#tAmount', '#tRate'].forEach(sel => {
        const el = $id(sel);
        if (el) el.addEventListener('input', refreshConversion);
        if (el) el.addEventListener('change', () => {
          if (sel === '#tCur') {
            $id('#tRate').value = rateOf($id('#tCur').value);
            refreshConversion();
          }
        });
      });

      const qc = $id('[data-act="quick-contact"]');
      if (qc) qc.addEventListener('click', e => {
        e.preventDefault();
        contactForm(null, () => {
          $id('#tContact').innerHTML = optContacts('');
          toast('تمت إضافة الطرف، اختره من القائمة', 'ok');
        });
      });

      function collect() {
        const cur = $id('#tCur').value;
        const isBase = cur === S.settings.base;
        const rate = isBase ? 1 : (+$id('#tRate').value || rateOf(cur));
        const amtVal = round2(parseAmount($id('#tAmount').value));
        const dateRaw = ($id('#tDate').value || '').trim();
        return {
          date: dateRaw,
          kind: curKind,
          amount: amtVal,
          currency: cur,
          rate: rate,
          base: round2(amtVal * rate),
          account: $id('#tAcc').value,
          toAccount: curKind === 'transfer' ? $id('#tToAcc').value : '',
          category: curKind === 'transfer' ? '' : $id('#tCat').value,
          contact: curKind === 'transfer' ? '' : $id('#tContact').value,
          method: $id('#tMethod').value,
          ref: $id('#tRef').value.trim(),
          desc: $id('#tDesc').value.trim(),
          note: $id('#tNote').value.trim()
        };
      }

      function submit(again) {
        const v = collect();
        const err = $id('#tErr');
        if (!v.date) {
          err.textContent = '⚠️ أدخل التاريخ — الحقل فارغ أو التاريخ غير موجود في التقويم (مثل 29 فبراير في سنة غير كبيسة)';
          return;
        }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date) || isNaN(new Date(v.date + 'T00:00:00'))) {
          err.textContent = '⚠️ التاريخ غير صالح — استخدم صيغة السنة-الشهر-اليوم';
          return;
        }
        if (!(v.amount > 0)) { err.textContent = '⚠️ أدخل مبلغاً أكبر من صفر'; return; }
        if (!v.account) { err.textContent = '⚠️ اختر الحساب'; return; }
        if (v.kind === 'transfer') {
          if (!v.toAccount) { err.textContent = '⚠️ اختر الحساب المحوّل إليه'; return; }
          if (v.toAccount === v.account) { err.textContent = '⚠️ لا يمكن التحويل لنفس الحساب'; return; }
        }
        if (lockedDate(v.date)) { err.textContent = '🔒 ' + lockMsg(); return; }
        if (!isNew && lockedDate(t.date)) { err.textContent = '🔒 هذه المعاملة في فترة مقفلة ولا يمكن تعديلها'; return; }
        const amtTxt = fmt(v.amount) + ' ' + v.currency + (v.desc ? ' — ' + v.desc : '');
        const negWarn = (() => {
          const before = accountBalance(v.account);
          const delta = v.kind === 'income' ? v.amount * 1 : (v.kind === 'expense' ? -v.amount * 1 : 0);
          const after = before + (v.kind === 'transfer' ? -v.amount : delta) * 1;
          return (v.kind !== 'income' && before >= 0 && after < 0) ? { acc: accName(v.account), after: after } : null;
        })();
        if (isNew) {
          v.id = _rcptFormTxn || uid();
          v.created = Date.now();
          v.updatedAt = Date.now();
          v.createdBy = CU ? CU.name : '';
          v.receipts = _rcptPending.slice();
          S.txns.push(v);
          logAct('add', 'معاملة ' + ({ income: 'وارد', expense: 'منصرف', transfer: 'تحويل' })[v.kind] + ': ' + amtTxt);
        } else {
          const idx = S.txns.findIndex(x => x.id === id);
          const before = S.txns[idx];
          v.id = id;
          v.created = before.created || Date.now();
          v.createdBy = before.createdBy || '';
          v.updatedBy = CU ? CU.name : '';
          v.updatedAtLabel = nowStamp();
          v.updatedAt = Date.now();
          v.receipts = _rcptPending.slice();
          S.txns[idx] = v;
          logAct('edit', 'تعديل معاملة ' + ({ income: 'وارد', expense: 'منصرف', transfer: 'تحويل' })[v.kind] + ': ' + amtTxt +
            (before.amount != null && (+before.amount !== +v.amount || before.kind !== v.kind)
              ? ' (كانت ' + fmt(before.amount) + ' ' + before.currency + ' ' + ({ income: 'وارد', expense: 'منصرف', transfer: 'تحويل' })[before.kind] + ')' : ''));
        }
        save();
        toast(isNew ? 'تمت إضافة المعاملة ✓' : 'تم تعديل المعاملة ✓', 'ok');
        if (negWarn) {
          setTimeout(() => toast('⚠️ تنبيه: رصيد «' + negWarn.acc + '» صار سالباً (' + fmt(negWarn.after) + ' ' + S.settings.base + ') — تحقّق من الرصيد الافتتاحي إن كان خطأً', 'warn'), 350);
        }
        if (again) {
          close();
          setTimeout(() => txnForm(null), 60);
        } else {
          close();
          renderView();
        }
      }

      wrap.querySelector('[data-save]').addEventListener('click', () => submit(false));
      const sn = wrap.querySelector('[data-save-new]');
      if (sn) sn.addEventListener('click', () => submit(true));

      refreshKind();
      refreshConversion();
      setTimeout(() => { const a = $id('#tAmount'); if (a) a.focus(); }, 80);
    }
  });
}

          '<th class="num">رصيد افتتاحي</th><th class="num">عدد الحركات</th><th class="num">الرصيد الحالي</th><th class="no-print">إجراءات</th>' +
        '</tr></thead><tbody>' + rows + '</tbody>' +
        '<tfoot><tr><td colspan="5">إجمالي الأرصدة</td><td class="num">' + fmt(sum) + '</td><td class="no-print"></td></tr></tfoot></table></div>'

    '</div>';
}

function statementModal(id) {
  const c = S.contacts.find(x => x.id === id);
  if (!c) return;
  const list = S.txns.filter(t => t.contact === id)
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0));
  let run = +c.opening || 0;
  const body =
    '<div class="filters no-print" style="margin-bottom:12px">' +
      '<div class="field"><label>من</label><input type="date" id="sFrom" value=""></div>' +
      '<div class="field"><label>إلى</label><input type="date" id="sTo" value="' + todayISO() + '"></div>' +
      '<button class="btn ghost sm" data-print>🖨️ طباعة</button>' +
    '</div>' +
    '<div id="stmtBody"></div>';

  const m = modal({ title: 'كشف حساب — ' + c.name, body: body, wide: true, footer: '<button class="btn ghost" data-close>إغلاق</button>' });

  function paint() {
    const from = m.wrap.querySelector('#sFrom').value;
    const to = m.wrap.querySelector('#sTo').value;
    run = +c.opening || 0;
    let rows = '';
    let cnt = 0, tIn = 0, tOut = 0;
    list.forEach(t => {
      const amt = t.base != null ? +t.base : toBase(t.amount, t.currency);
      if (from && t.date < from) { if (t.kind === 'income') run += amt; else if (t.kind === 'expense') run -= amt; return; }
      if (!inRange(t.date, from, to)) return;
      cnt++;
      if (t.kind === 'income') { run += amt; tIn += amt; } else if (t.kind === 'expense') { run -= amt; tOut += amt; }
      rows += '<tr><td class="small nowrap">' + esc(dmy(t.date)) + '</td>' +
        '<td>' + txnBadge(t.kind) + '</td>' +
        '<td>' + esc(t.desc || catName(t.category) || '—') + (t.ref ? '<div class="small muted">' + esc(t.ref) + '</div>' : '') + '</td>' +
        '<td class="num" style="color:var(--in)">' + (t.kind === 'income' ? fmt(amt) : '') + '</td>' +
        '<td class="num" style="color:var(--out)">' + (t.kind === 'expense' ? fmt(amt) : '') + '</td>' +
        '<td class="num" style="font-weight:700">' + fmt(run) + '</td></tr>';
    });
    m.wrap.querySelector('#stmtBody').innerHTML =
      '<div class="grid g3" style="margin-bottom:12px">' +
        '<div class="card stat"><div class="label">رصيد افتتاحي</div><div class="value" style="font-size:19px">' + fmt(c.opening || 0) + '</div></div>' +
        '<div class="card stat in"><div class="label">إجمالي الوارد</div><div class="value" style="font-size:19px">' + fmt(tIn) + '</div></div>' +
        '<div class="card stat out"><div class="label">إجمالي المنصرف</div><div class="value" style="font-size:19px">' + fmt(tOut) + '</div></div>' +
      '</div>' +
      (cnt ? '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th>' +
        '<th class="num">وارد</th><th class="num">منصرف</th><th class="num">الرصيد</th></tr></thead><tbody>' + rows + '</tbody>' +
        '<tfoot><tr><td colspan="3">الرصيد النهائي</td><td class="num">' + fmt(tIn) + '</td><td class="num">' + fmt(tOut) + '</td><td class="num">' + fmt(run) + '</td></tr></tfoot>' +
        '</table></div>' : '<div class="empty">لا توجد حركات في هذه الفترة</div>');
  }

  m.wrap.querySelector('#sFrom').addEventListener('change', paint);
  m.wrap.querySelector('#sTo').addEventListener('change', paint);
  m.wrap.querySelector('[data-print]').addEventListener('click', () => window.print());
  paint();
}

/* =========================================================
   التقارير
   ========================================================= */
function reportList() {
  return S.txns.filter(t => inRange(t.date, ui.rep.from, ui.rep.to) &&
    (!ui.rep.contact || t.contact === ui.rep.contact));
}

function catBreakdown(list, kind) {
  const map = {};
  list.forEach(t => {
    if (t.kind !== kind) return;
    const key = t.category || '__none';
    if (!map[key]) map[key] = { id: key, sum: 0, n: 0 };
    map[key].sum += t.base != null ? +t.base : toBase(t.amount, t.currency);
    map[key].n++;
  });
  return Object.values(map).sort((a, b) => b.sum - a.sum);
}

function barList(items, cls, total) {
  if (!items.length) return '<div class="empty small">لا توجد بيانات</div>';
  return items.map(it => {
    const pct = total > 0 ? (it.sum / total * 100) : 0;
    const name = it.id === '__none' ? 'بدون بند' : (catName(it.id) || 'بند محذوف');
    return '<div class="bar-row"><div title="' + esc(name) + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(name) + '</div>' +
      '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + Math.max(pct, 0.8).toFixed(1) + '%"></div></div>' +
      '<div class="num small" style="text-align:left"><b>' + fmt(it.sum) + '</b> <span class="muted">' + pct.toFixed(0) + '%</span></div></div>';
  }).join('');
}

function userForm(id) {
  const isFirst = !S.users.length;
  const hasAdmin = S.users.some(u => u.role === 'admin' && u.active !== false);
  const u = id ? S.users.find(x => x.id === id) : { name: '', role: (isFirst || !hasAdmin) ? 'admin' : 'accountant' };
  if (!u) return;
  modal({
    title: id ? 'تعديل مستخدم' : 'مستخدم جديد',
    body:
      '<div class="form-grid">' +
        '<div class="field full"><label>الاسم *</label><input id="uName" value="' + esc(u.name) + '" placeholder="مثال: أحمد"></div>' +

        const name = $id('#uName').value.trim();
        const role = $id('#uRole').value;
        const pw = $id('#uPw').value, pw2 = $id('#uPw2').value;
        const err = $id('#uErr');

          err.textContent = '⚠️ يجب إنشاء حساب «مدير» واحد على الأقل قبل بقية الصلاحيات'; return;
        }
        if (!id && (!pw || pw.length < 4)) { err.textContent = '⚠️ كلمة المرور: 4 أحرف على الأقل'; return; }
        if (pw && pw.length < 4) { err.textContent = '⚠️ كلمة المرور: 4 أحرف على الأقل'; return; }
        if (pw !== pw2) { err.textContent = '⚠️ كلمتا المرور غير متطابقتين'; return; }
        // حماية آخر مدير
        if (id && u.role === 'admin' && role !== 'admin') {
          const admins = S.users.filter(x => x.role === 'admin' && x.active !== false);
          if (admins.length <= 1) { err.textContent = '⚠️ لا يمكن إلغاء صلاحية آخر مدير في البرنامج'; return; }
        }
        const actEl = $id('#uActive');
        if (id && actEl && !actEl.checked) {
          const others = S.users.filter(x => x.id !== id && x.active !== false);
          if (!others.length) { err.textContent = '⚠️ يجب أن يبقى مستخدم واحد مفعّل على الأقل'; return; }
        }
        if (id) {
          u.name = name; u.role = role;
          if (typeof $id('#uActive') !== 'undefined' && $id('#uActive')) u.active = $id('#uActive').checked;
          u.updatedAt = Date.now();
          if (pw) { const rec = await secMakePwRecord(pw); u.salt = rec.salt; u.hash = rec.hash; u.alg = rec.alg; }
          if (CU && CU.id === u.id) CU = { id: u.id, name: u.name, role: u.role };
          logAct('user', 'تعديل مستخدم: ' + name + ' (' + ROLE_NAMES[role] + ')');
        } else {
          const wasEmpty = S.users.length === 0;
          const rec = await secMakePwRecord(pw);
          const nu = { id: uid(), name: name, role: role, salt: rec.salt, hash: rec.hash, alg: rec.alg, created: todayISO(), active: true };
          nu.updatedAt = Date.now();
          S.users.push(nu);
          if (wasEmpty) CU = { id: nu.id, name: nu.name, role: nu.role };  // أول مستخدم: دخول مباشر
          logAct('user', 'إضافة مستخدم: ' + name + ' (' + ROLE_NAMES[role] + ')');
        }
        saveNow(); close(); render(); toast('تم الحفظ ✓', 'ok');
      });
    }
  });
}

/* =========================================================
   التصدير والاستيراد
   ========================================================= */
function download(blob, filename) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  } catch (e) {
    toast('تعذر التنزيل في هذا الوضع', 'err');
  }
}

function stamp() {
  const d = new Date();
  return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
}

function importJson() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let obj = null;
      try { obj = JSON.parse(rd.result); } catch (e) { toast('الملف غير صالح (ليس JSON)', 'err'); return; }
      if (secIsEncrypted(obj)) {           // نسخة مشفّرة: نطلب كلمة المرور أولاً
        secAskDecrypt(obj, dec => { secApplyImported(dec); });
        return;
      }
      secApplyImported(obj);
    };
    rd.readAsText(f);
  });
  inp.click();
}

/* ---------- استيراد CSV ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else q = false;
      } else cell += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c !== '\r') cell += c;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

function normDate(v) {
  function ok(y, m, d) {
    y = +y; m = +m; d = +d;
    if (!(y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
    const dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return '';
    return y + '-' + pad2(m) + '-' + pad2(d);
  }
  v = String(v || '').trim().replace(/[.]/g, '/');
  let m = v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if (m) return ok(m[1], m[2], m[3]);
  m = v.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if (m) return ok(m[3], m[2], m[1]);
  return '';
}
function normText(v) {
  return String(v || '').trim().replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ');
}
function findCol(headers, keys) {
  for (let i = 0; i < headers.length; i++) {
    const h = normText(headers[i]);
    if (keys.some(k => h.indexOf(normText(k)) !== -1)) return i;
  }
  return -1;
}

function parseCsvRows(rows) {
  if (!rows.length) return { data: [], headerOk: false };
  const headers = rows[0].map(x => String(x).trim());
  const col = {
    date: findCol(headers, ['تاريخ', 'date']),
    kind: findCol(headers, ['نوع', 'type']),
    desc: findCol(headers, ['بيان', 'وصف', 'desc']),
    cat: findCol(headers, ['بند', 'تصنيف', 'categ']),
    contact: findCol(headers, ['طرف', 'عميل', 'مورد', 'contact']),
    account: findCol(headers, ['حساب', 'صندوق', 'account']),
    method: findCol(headers, ['طريقه', 'طريقة', 'payment', 'method']),
    ref: findCol(headers, ['مرجع', 'مستند', 'ref']),
    amount: findCol(headers, ['مبلغ', 'amount']),
    currency: findCol(headers, ['عمله', 'عملة', 'currency'])
  };
  const headerOk = col.date !== -1 && col.amount !== -1;
  const data = rows.slice(1).map((r, i) => {
    const get = k => (col[k] === -1 ? '' : String(r[col[k]] == null ? '' : r[col[k]]).trim());
    const kindTxt = normText(get('kind'));
    let kind = 'expense';
    if (kindTxt.indexOf('وارد') !== -1 || /income/i.test(kindTxt)) kind = 'income';
    else if (kindTxt.indexOf('تحويل') !== -1 || /transfer/i.test(kindTxt)) kind = 'transfer';
    const amount = round2(parseAmount(get('amount')));
    const date = normDate(get('date'));
    const errors = [];
    if (!date) errors.push('تاريخ غير صالح');
    if (!(amount > 0)) errors.push('مبلغ غير صالح');
    if (date && lockedDate(date)) errors.push('تاريخ في فترة مقفلة');
    return {
      n: i + 1, kind: kind, date: date, amount: amount,
      desc: get('desc'), cat: get('cat'), contact: get('contact'),
      account: get('account'), method: get('method'), ref: get('ref'),
      currency: (get('currency') || S.settings.base).toUpperCase(), errors: errors
    };
  });
  return { data: data, headerOk: headerOk, headers: headers };
}

function csvImportModal() {
  const body =
    '<div class="notice blue" style="margin-bottom:12px">📄 <div>يُقبل ملف CSV بالعربية أو الإنجليزية. الأعمدة المطلوبة: <b>التاريخ</b> و<b>المبلغ</b>، ويُفضّل أيضاً: النوع، البيان، البند، الطرف، الحساب، العملة.<br>' +
      '<button class="btn ghost sm" style="margin-top:8px" data-act="csv-template">⬇️ تنزيل نموذج CSV</button></div></div>' +
    '<div class="field"><label>ملف CSV</label><input type="file" id="csvFile" accept=".csv,text/csv"></div>' +
    '<label class="small" style="display:flex;align-items:center;gap:8px;margin-top:12px">' +
      '<input type="checkbox" id="csvCreate" checked style="width:auto;margin:0"> إنشاء الحسابات/البنود/الأطراف غير الموجودة تلقائياً</label>' +
    '<div id="csvPreview" style="margin-top:14px"></div>' +
    '<div id="csvErr" style="color:var(--out);font-size:13px;margin-top:8px"></div>';
  let parsed = null;
  modal({
    title: 'استيراد معاملات من CSV', wide: true, body: body,
    footer: '<button class="btn" data-import disabled>⬆️ استيراد</button><button class="btn ghost" data-close>إلغاء</button>',
    after: (wrap, close) => {
      const $id = q => wrap.querySelector(q);
      $id('#csvFile').addEventListener('change', e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          const rows = parseCSV(String(rd.result || ''));
          parsed = parseCsvRows(rows);
          if (!parsed.headerOk) {
            $id('#csvPreview').innerHTML = '<div class="notice">⚠️ <div>لم يتم العثور على عمودي «التاريخ» و«المبلغ». تأكد من الصف الأول (رؤوس الأعمدة).</div></div>';
            $id('[data-import]').disabled = true;
            return;
          }
          const ok = parsed.data.filter(r => !r.errors.length).length;
          const bad = parsed.data.length - ok;
          $id('[data-import]').disabled = ok === 0;
          $id('[data-import]').textContent = '⬆️ استيراد ' + ok + ' معاملة';
          const sum = parsed.data.filter(r => !r.errors.length).reduce((a, r) => {
            if (r.kind === 'income') a.income += r.amount;
            else if (r.kind === 'expense') a.expense += r.amount;
            else a.transfer += r.amount;
            return a;
          }, { income: 0, expense: 0, transfer: 0 });
          $id('#csvPreview').innerHTML =
            '<div class="notice blue" style="margin-bottom:10px">🧾 <div>سيُضاف: <b>' + ok + '</b> معاملة · ' +
              'وارد <b>' + fmt(sum.income) + '</b> · منصرف <b>' + fmt(sum.expense) + '</b>' +
              (sum.transfer ? ' · تحويل <b>' + fmt(sum.transfer) + '</b>' : '') +
              '<br><span class="small">الصافي بعد الاستيراد: <b>' + fmt(sum.income - sum.expense) + ' ' + esc(S.settings.base) + '</b>' +
              (bad ? ' · <span style="color:var(--out)">' + bad + ' سطراً سيُتجاهل</span>' : '') +
              ' — راجع الأسطر أدناه قبل التأكيد.</span></div></div>' +
            '<div class="grid g3" style="margin-bottom:10px">' +
              '<div class="card stat"><div class="label">أسطر صالحة</div><div class="value" style="font-size:20px;color:var(--in)">' + ok + '</div></div>' +
              '<div class="card stat"><div class="label">أسطر بها أخطاء</div><div class="value" style="font-size:20px;color:var(--out)">' + bad + '</div></div>' +
              '<div class="card stat"><div class="label">الإجمالي</div><div class="value" style="font-size:20px">' + parsed.data.length + '</div></div>' +
            '</div>' +
            '<div class="table-wrap scroll-y"><table><thead><tr><th>#</th><th>التاريخ</th><th>النوع</th><th>البيان</th><th class="num">المبلغ</th><th>الحالة</th></tr></thead><tbody>' +
            parsed.data.slice(0, 50).map(r => '<tr><td class="small muted">' + r.n + '</td><td class="small">' + esc(r.date || '—') + '</td>' +
              '<td class="small">' + ({ income: 'وارد', expense: 'منصرف', transfer: 'تحويل' })[r.kind] + '</td>' +
              '<td class="small">' + esc(r.desc || r.cat || '—') + '</td><td class="num">' + fmt(r.amount) + ' ' + esc(r.currency) + '</td>' +
              '<td>' + (r.errors.length ? '<span class="badge out">' + esc(r.errors[0]) + '</span>' : '<span class="badge in">جاهز</span>') + '</td></tr>').join('') +
            '</tbody></table></div>' +
            (parsed.data.length > 50 ? '<div class="small muted" style="margin-top:6px">تُعرض أول 50 معاملة للمعاينة.</div>' : '');
        };
        rd.readAsText(f, 'UTF-8');
      });

      $id('[data-import]').addEventListener('click', () => {
        if (!parsed) return;
        const createMissing = $id('#csvCreate').checked;
        let added = 0, skipped = 0;
        const ensured = { acc: 0, cat: 0, con: 0 };
        const accByName = name => {
          name = String(name || '').trim();
          if (!name) return S.accounts[0] || null;
          let o = S.accounts.find(x => normText(x.name) === normText(name));
          if (!o && createMissing) { o = { id: uid(), name: name, type: 'cash', currency: S.settings.base, opening: 0, note: 'أُنشئ بالاستيراد' }; S.accounts.push(o); ensured.acc++; }
          return o;
        };
        const catByName = name => {
          name = String(name || '').trim();
          if (!name) return null;
          let o = S.categories.find(x => normText(x.name) === normText(name));
          if (!o && createMissing) { o = { id: uid(), name: name, kind: 'both' }; S.categories.push(o); ensured.cat++; }
          return o;
        };
        const conByName = name => {
          name = String(name || '').trim();
          if (!name) return null;
          let o = S.contacts.find(x => normText(x.name) === normText(name));
          if (!o && createMissing) { o = { id: uid(), name: name, type: 'both', phone: '', opening: 0, note: 'أُنشئ بالاستيراد' }; S.contacts.push(o); ensured.con++; }
          return o;
        };
        const curOrDefault = c => (S.currencies.some(x => x.code === c) ? c : S.settings.base);

        parsed.data.forEach((r, i) => {
          if (r.errors.length) { skipped++; return; }
          const tk = r.kind;
          let accountId = '', toAccountId = '';
          if (tk === 'transfer') {
            const parts = String(r.account || '').split(/←|<-|→/).map(x => x.trim()).filter(Boolean);
            const a1 = accByName(parts[0]);
            const a2 = accByName(parts[1]);
            if (!a1 || !a2) { skipped++; return; }
            accountId = a1.id; toAccountId = a2.id;
          } else {
            const a = accByName(r.account);
            if (!a) { skipped++; return; }
            accountId = a.id;
          }
          const cat = tk === 'transfer' ? null : catByName(r.cat);
          const con = tk === 'transfer' ? null : conByName(r.contact);
          const cur = curOrDefault(r.currency);
          const rate = cur === S.settings.base ? 1 : rateOf(cur);
          S.txns.push({
            id: uid(), date: r.date, kind: tk, amount: r.amount, currency: cur, rate: rate,
            base: round2(r.amount * rate), account: accountId, toAccount: toAccountId,
            category: cat ? cat.id : '', contact: con ? con.id : '',
            method: r.method || '', ref: r.ref || '', desc: r.desc || '', note: 'استيراد CSV',
            created: Date.now() + i, createdBy: CU ? CU.name : ''
          });
          added++;
        });
        saveNow();
        logAct('import', 'استيراد CSV: ' + added + ' معاملة' + (skipped ? ' (' + skipped + ' متجاهلة)' : ''));
        close();
        renderView();
        toast('تم استيراد ' + added + ' معاملة' + (skipped ? ' · تجاهل ' + skipped : '') + ' ✓', added ? 'ok' : 'err');
        if (ensured.acc || ensured.cat || ensured.con) {
          setTimeout(() => toast('أُنشئ: ' + ensured.acc + ' حساب، ' + ensured.cat + ' بند، ' + ensured.con + ' طرف', 'ok'), 900);
        }
      });
    }
  });
}

function downloadCsvTemplate() {
  const head = ['التاريخ', 'النوع', 'البيان', 'البند', 'الطرف', 'الحساب', 'طريقة الدفع', 'المرجع', 'المبلغ', 'العملة'];
  const rows = [
    [todayISO(), 'وارد', 'مبيعات نقدية', 'مبيعات', 'شركة الأمل', (S.accounts[0] || {}).name || 'الصندوق الرئيسي', 'نقداً', 'INV-1001', '150000', S.settings.base],
    [todayISO(), 'منصرف', 'إيجار المحل', 'إيجار', '', (S.accounts[0] || {}).name || 'الصندوق الرئيسي', 'بنك', '', '40000', S.settings.base]
  ];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [head.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n');
  download(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), 'نموذج-استيراد-المعاملات.csv');
  toast('تم تنزيل النموذج ✓', 'ok');
}

  const list = S.txns.filter(t => t.account === id || t.toAccount === id)
    .sort((x, y) => (y.date || '').localeCompare(x.date || ''));
  const t = totals(list);

    title: 'حركات الحساب — ' + a.name,

        '<div class="card stat in"><div class="label">إجمالي الداخل</div><div class="value" style="font-size:19px">' + fmt(t.income) + '</div></div>' +
        '<div class="card stat out"><div class="label">إجمالي الخارج</div><div class="value" style="font-size:19px">' + fmt(t.expense) + '</div></div>' +

/* تبويب آخر على نفس الجهاز كتب بيانات → نُحدّث الشاشة بدل العمل على نسخة قديمة */
function bindTabSync() {
  window.addEventListener('storage', ev => {
    try {
      if (!ev || ev.key !== LS_KEY || !ev.newValue) return;
      if (ev.newValue === LAST_WRITTEN) return;
      if (typeof cryptLocked === 'function' && cryptLocked()) return;
      const fresh = loadState();
      if (!fresh) return;
      // ندمج بدل الاستبدال: قد يكون لنا تغيير غير مكتوب بعد
      S = fresh;
      LAST_WRITTEN = ev.newValue;
      TAB_SYNCED_AT = Date.now();
      try { render(); } catch (e) {}
      toast('🔄 تم تحديث البيانات من نافذة أخرى على هذا الجهاز', 'ok');
    } catch (e) {}
  });
}

function bindGlobal() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const need = ACT_PERM[act];
    if (need && !can(need)) { e.preventDefault(); toast('لا تملك صلاحية لهذا الإجراء', 'err'); return; }
    const fn = ACTIONS[act];
    if (fn) { e.preventDefault(); fn(el); }
  });

  document.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'fQ') { ui.txn.q = e.target.value; scheduleTxnList(); }
    else if (id === 'auditQ') { ui.audit.q = e.target.value; scheduleAudit(); }
    else if (id === 'setCompany') {
      S.settings.company = e.target.value;
      touchSettings();
      const b = document.querySelector('.brand-txt b');
      if (b) b.textContent = S.settings.company || 'برنامج الحسابات';
      save();
    }
  });

  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'fFrom') { ui.txn.from = e.target.value; refreshTxnList(); }
    else if (id === 'fTo') { ui.txn.to = e.target.value; refreshTxnList(); }
    else if (id === 'fKind') { ui.txn.kind = e.target.value; refreshTxnList(); }
    else if (id === 'rcptInput') {
      const f = Array.prototype.slice.call(e.target.files || []);  // نسخة قبل التفريغ (FileList حيّة)
      e.target.value = '';
      if (f.length) rcptAddFiles(_rcptFormTxn, f, _rcptPending).then(() => rcptPaintList());
    }
    else if (id === 'fAcc') { ui.txn.account = e.target.value; refreshTxnList(); }
    else if (id === 'repFrom') { ui.rep.from = e.target.value; renderView(); }
    else if (id === 'repTo') { ui.rep.to = e.target.value; renderView(); }
    else if (id === 'repContact') { ui.rep.contact = e.target.value; renderView(); }
    else if (id === 'asOfDate') { ui.asOf = e.target.value; renderView(); }
    else if (id === 'auditUser') { ui.audit.user = e.target.value; renderView(); }
    else if (id === 'auditAct') { ui.audit.action = e.target.value; renderView(); }
    else if (id === 'setBase') {
      const code = e.target.value;
      const oldBase = S.settings.base;
      if (code === oldBase) return;
      const perNew = rateOf(code);
      ask('تغيير العملة الأساسية من ' + oldBase + ' إلى ' + code + '؟ ستُحوَّل كل المبالغ والأسعار تلقائياً (1 ' + code + ' = ' + fmt(perNew) + ' ' + oldBase + ') وتبقى القيم الحقيقية كما هي.', 'تغيير العملة')
        .then(ok => {
          if (!ok) { renderView(); return; }
          if (!changeBaseCurrency(code)) { toast('تعذّر تغيير العملة الأساسية', 'err'); renderView(); return; }
          logAct('settings', 'تغيير العملة الأساسية من ' + oldBase + ' إلى ' + code);
          saveNow(); render(); toast('صارت العملة الأساسية ' + code + ' — حُوّلت كل المبالغ والأسعار', 'ok');
        });
    }
    else if (id === 'setTheme') {
      S.settings.theme = e.target.value;
      document.documentElement.setAttribute('data-theme', e.target.value);
      saveNow();
    }
    else if (id === 'setBooksStart') {
      S.settings.booksStart = e.target.value;
      touchSettings();
      logAct('settings', 'بداية الدفاتر: ' + (e.target.value ? dmy(e.target.value) : 'بدون'));
      saveNow(); renderView(); toast('تم حفظ بداية الدفاتر ✓', 'ok');
    }
    else if (id === 'setLockUntil') {
      S.settings.lockUntil = e.target.value;
      touchSettings();
      logAct('settings', e.target.value ? 'إقفال الفترة حتى ' + dmy(e.target.value) : 'فك إقفال الفترات');
      saveNow(); renderView();
      toast(e.target.value ? 'تم إقفال الفترة حتى ' + dmy(e.target.value) : 'تم فك الإقفال', 'ok');
    }
    else if (id === 'setBackupDays') {
      S.settings.backupDays = +e.target.value || 7;
      saveNow(); toast('التذكير كل ' + S.settings.backupDays + ' أيام', 'ok');
    }
    else if (id === 'pwAuto') {
      S.settings.autoLock = e.target.checked;
      touchSettings(); saveNow();
      toast(e.target.checked ? 'سيُقفل البرنامج تلقائياً بعد ' + (S.settings.autoLockMin || 5) + ' دقائق خمول' : 'تم إيقاف القفل التلقائي', 'ok');
    }
    else if (id === 'setAutoLockMin') {
      S.settings.autoLockMin = +e.target.value || 5;
      touchSettings(); saveNow();
      toast('مدة القفل التلقائي: ' + S.settings.autoLockMin + ' دقائق', 'ok');
    }
    else if (id === 'setTrashDays') {
      S.settings.trashDays = +e.target.value || 0;
      touchSettings(); saveNow();
      const removed = purgeTrashNow(true);
      renderView();
      toast('الاحتفاظ بالسلة: ' + (S.settings.trashDays ? S.settings.trashDays + ' يوماً' : 'بلا حد') + (removed ? ' — أُفرغ ' + removed : ''), 'ok');
    }
    else if (id === 'setLockHide') {
      S.settings.lockOnHide = !!e.target.checked;
      touchSettings(); saveNow();
      toast(e.target.checked ? 'سيُقفل البرنامج عند إخفاء التبويب' : 'أُلغي القفل عند إخفاء التبويب', 'ok');
    }
    else if (e.target.classList.contains('cur-rate')) {
      const code = e.target.dataset.code;
      const c = S.currencies.find(x => x.code === code);
      if (c) { c.rate = +e.target.value || 1; c.updatedAt = Date.now(); touchSettings(); saveNow(); toast('تم تحديث سعر ' + code, 'ok'); }
    }
  });

  document.addEventListener('click', e => {
    const layout = document.getElementById('layout');
    if (layout && layout.classList.contains('nav-open') &&
        !e.target.closest('.sidebar') && !e.target.closest('[data-act="toggle-nav"]')) {
      layout.classList.remove('nav-open');
    }
  }, true);

  window.addEventListener('beforeunload', () => {
    if (typeof cryptLocked === 'function' && cryptLocked()) return;   // شاشة الفتح: لا شيء للكتابة
    saveNow(); try { cryptFlush(); } catch (e) {}
  });
  window.addEventListener('pagehide', () => { saveNow(); try { cryptFlush(); } catch (e) {} });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { saveNow(); try { cryptFlush(); } catch (e) {} }
  });
}

  if (cryptLocked()) { renderCryptUnlock(); return; }
  await bootApp();
})();

var _syncing = false;
var _syncTimer = null;

function syncCfg() { return (S.settings && S.settings.sync) || null; }
function syncReady() {
  const c = syncCfg();
  return !!(c && c.url && c.anonKey && c.accessToken && c.uid && c.enabled !== false);
}
function syncNormUrl(u) { return String(u || '').trim().replace(/\/+$/, ''); }

function syncStatusLabel() {
  const c = syncCfg();
  if (!c || !c.url || !c.anonKey) return 'غير مفعّلة';
  if (!c.accessToken) return 'بانتظار تسجيل الدخول';
  if (_syncing) return 'جارٍ المزامنة…';
  if (!c.lastSyncTs) return 'لم تتم مزامنة بعد';
  const m = Math.floor((Date.now() - c.lastSyncTs) / 60000);
  if (m < 1) return 'متزامن الآن';
  if (m < 60) return 'آخر مزامنة قبل ' + m + ' دقيقة';
  const h = Math.floor(m / 60);
  if (h < 24) return 'آخر مزامنة قبل ' + h + ' ساعة';
  return 'آخر مزامنة قبل ' + Math.floor(h / 24) + ' يوم';
}

function syncBadgeHtml() {
  const c = syncCfg();
  if (!c || !c.url || !c.anonKey) return '';
  let ico = '☁️', title = 'المزامنة السحابية: ' + syncStatusLabel();
  if (_syncing) ico = '🔄';
  else if (!c.accessToken) ico = '☁️';
  else if (!navigator.onLine) ico = '📴';
  else if (c.lastSyncTs && Date.now() - c.lastSyncTs < 5 * 60000) ico = '☁️✓';
  return '<button class="btn ghost sm" data-act="sync-now" title="' + esc(title) + '" aria-label="' + esc(title) + '">' + ico + '</button>';
}

/* ---------- نداءات Supabase ---------- */
async function sbAuthCall(path, body) {
  const c = syncCfg();
  const res = await fetch(syncNormUrl(c.url) + path, {
    method: 'POST',
    headers: { 'apikey': c.anonKey, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  let data = null;
  const txt = await res.text();
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
  return { ok: res.ok, status: res.status, data: data, raw: txt };
}

async function sbEnsureToken(force) {
  const c = syncCfg();
  if (!c || !c.refreshToken) return !!(c && c.accessToken);
  if (!force && c.accessToken && c.expiresAt && Date.now() < c.expiresAt - 60000) return true;
  const r = await sbAuthCall('/auth/v1/token?grant_type=refresh_token', { refresh_token: c.refreshToken });
  if (r.ok && r.data && r.data.access_token) {
    c.accessToken = r.data.access_token;
    c.refreshToken = r.data.refresh_token || c.refreshToken;
    c.expiresAt = Date.now() + (r.data.expires_in || 3600) * 1000;
    if (r.data.user) c.uid = r.data.user.id;
    saveNow();
    return true;
  }
  return false;
}

async function sbRest(method, path, body, _retry) {
  const c = syncCfg();
  await sbEnsureToken();
  const headers = {
    apikey: c.anonKey,
    Authorization: 'Bearer ' + (c.accessToken || c.anonKey),
    'Content-Type': 'application/json',
    Prefer: 'return=representation'
  };
  const res = await fetch(syncNormUrl(c.url) + '/rest/v1/' + path, {
    method: method,
    headers: headers,
    body: body ? JSON.stringify(body) : undefined
  });
  let data = null;
  const txt = await res.text();
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
  if (res.status === 401 && !_retry) {
    const ok = await sbEnsureToken(true);
    if (ok) return sbRest(method, path, body, true);
  }
  return { ok: res.ok, status: res.status, data: data, raw: txt };
}

/* ---------- الدمج ---------- */
function syncStripSettings(st) {
  const c = Object.assign({}, st || {});
  delete c.sync;
  delete c.lastBackupTs;
  delete c.backupFile;
  delete c.snoozeTs;
  delete c.pw;
  return c;
}

function syncMergeArr(a, b) {
  const map = new Map();
  (a || []).forEach(x => { if (x && x.id) map.set(x.id, x); });
  (b || []).forEach(x => {
    if (!x || !x.id) return;
    const cur = map.get(x.id);
    if (!cur) { map.set(x.id, x); return; }
    const ta = cur.updatedAt || cur.created || 0;
    const tb = x.updatedAt || x.created || 0;
    if (tb > ta) map.set(x.id, x);
  });
  return Array.from(map.values());
}

function syncMergeDocs(local, remote) {
  local = local || {}; remote = remote || {};
  const ls = local.settings || {}, rs = remote.settings || {};

  // المحذوفات والمسترجعات: نأخذ الأحدث لكل معرّف من الجهازين
  const del = {}, res = {};
  const ld = local.deletedIds || {}, rd = remote.deletedIds || {};
  const lr = local.restoredIds || {}, rr = remote.restoredIds || {};
  Object.keys(ld).concat(Object.keys(rd)).forEach(k => {
    del[k] = Math.max(+ld[k] || 0, +rd[k] || 0);
  });
  Object.keys(lr).concat(Object.keys(rr)).forEach(k => {
    res[k] = Math.max(+lr[k] || 0, +rr[k] || 0);
  });
  // تنظيف ما مرّ عليه أكثر من سنة
  const yearAgo = Date.now() - 365 * 86400000;
  Object.keys(del).forEach(k => { if (del[k] < yearAgo) delete del[k]; });
  Object.keys(res).forEach(k => { if (res[k] < yearAgo) delete res[k]; });

  // الحذف يفوز إلا إذا جاء استرجاع أحدث منه
  const isDeleted = id => !!(del[id] && del[id] > (res[id] || 0));
  const keepLive = arr => (arr || []).filter(x => !isDeleted(x.id));

  const settings = (function () {
    const tsL = ls.updatedAt || 0, tsR = rs.updatedAt || 0;
    const base = tsR > tsL ? Object.assign({}, rs) : Object.assign({}, ls);
    // إعدادات خاصة بالجهاز لا تُزامن
    base.lastBackupTs = ls.lastBackupTs || 0;
    base.backupFile = ls.backupFile || '';
    base.snoozeTs = ls.snoozeTs || 0;
    base.sync = ls.sync || null;
    base.pw = null;
    return base;
  })();

  // العملات: دمج بالرمز
  const curMap = new Map();
  (local.currencies || []).forEach(c => curMap.set(c.code, c));
  (remote.currencies || []).forEach(c => {
    if (!curMap.has(c.code)) curMap.set(c.code, c);
    else {
      const a = curMap.get(c.code), tb = c.updatedAt || 0, ta = a.updatedAt || 0;
      if (tb > ta) curMap.set(c.code, c);
    }
  });

  // السجل: اتحاد بالمعرّف
  const auditMap = new Map();
  (remote.audit || []).forEach(a => auditMap.set(a.id, a));
  (local.audit || []).forEach(a => auditMap.set(a.id, a));
  // تصاعدي بالوقت (كرونولوجي) ليتوافق مع ترتيب الإضافة المحلية (push) — العرض يفرز تنازلياً
  const audit = Array.from(auditMap.values()).sort((x, y) => String(x.at || '').localeCompare(String(y.at || ''))).slice(-3000);

  // السلة: اتحاد بالمعرّف، ثم استبعاد ما أُفرغ نهائياً (trashClearedAt) وما استُعيد بعد حذفه.
  // بدون هذا كان «تفريغ السلة» يُلغى عند أول مزامنة لأن النسخة السحابية الأقدم تُعيد الإدخالات.
  const cleared = Math.max(+local.trashClearedAt || 0, +remote.trashClearedAt || 0);
  const trashMap = new Map();
  (local.trash || []).forEach(t => trashMap.set(t.id, t));
  (remote.trash || []).forEach(t => { if (!trashMap.has(t.id)) trashMap.set(t.id, t); });
  const trash = Array.from(trashMap.values()).filter(t => {
    const push = +t.ts || 0;
    if (push <= cleared) return false;                       // أُفرغت السلة بعد هذه الحذفة
    const orig = (t.item && t.item.id) || null;
    return !(orig && (+res[orig] || 0) > push);              // استُرجعت بعد الحذف
  });

  return {
    version: 1,
    settings: settings,
    currencies: Array.from(curMap.values()),
    accounts: keepLive(syncMergeArr(local.accounts, remote.accounts)),
    contacts: keepLive(syncMergeArr(local.contacts, remote.contacts)),
    categories: keepLive(syncMergeArr(local.categories, remote.categories)),
    txns: keepLive(syncMergeArr(local.txns, remote.txns)),
    users: keepLive(syncMergeArr(local.users, remote.users)),
    audit: audit,
    auditBase: local.auditBase || remote.auditBase || '',
    trash: trash,
    trashClearedAt: cleared,
    deletedIds: del,
    restoredIds: res
  };
}

function syncPayload(doc) {
  return {
    version: 1,
    settings: syncStripSettings(doc.settings),
    currencies: doc.currencies || [],
    accounts: doc.accounts || [],
    contacts: doc.contacts || [],
    categories: doc.categories || [],
    txns: doc.txns || [],
    users: doc.users || [],
    audit: (doc.audit || []).slice(-800),   // أحدث 800 قيداً (كان يرسل الأقدم فيضيع الحدث الأخير في نسخة السحابة)
    auditBase: doc.auditBase || '',
    trash: (doc.trash || []).slice(0, 100),
    trashClearedAt: +doc.trashClearedAt || 0,
    deletedIds: doc.deletedIds || {},
    restoredIds: doc.restoredIds || {}
  };
}

function syncApply(merged) {
  S.settings = merged.settings;
  S.currencies = merged.currencies;
  S.accounts = merged.accounts;
  S.contacts = merged.contacts;
  S.categories = merged.categories;
  S.txns = merged.txns;
  S.users = merged.users;
  S.audit = merged.audit;
  S.auditBase = merged.auditBase || S.auditBase || '';
  // رأس السلسلة = أحدث قيد موثّق (حتى تستمر السلسلة صحيحة بعد الدمج)
  const newestSealed = (merged.audit || []).find(a => a && a.h);
  if (newestSealed) S.auditHead = newestSealed.h;
  S.trash = merged.trash;
  S.trashClearedAt = +merged.trashClearedAt || 0;
  S.deletedIds = merged.deletedIds;
  S.restoredIds = merged.restoredIds || {};
  saveNow();
  syncRepaint();
}

/* تحديث خفيف للواجهة بعد المزامنة (بدون إعادة بناء الهيكل حتى لا تُفقد الحقول) */
function syncPaintBadge() {
  const w = document.getElementById('syncBadge');
  if (w) w.innerHTML = syncBadgeHtml();
}
function syncRepaint() {
  syncPaintBadge();
  if (!document.getElementById('view')) return;
  if (document.querySelector('.modal-backdrop')) return;       // لا تقاطع نافذة مفتوحة
  const ae = document.activeElement;
  if (ae && ae.closest && ae.closest('#view input, #view textarea, #view select')) return; // لا تقاطع الكتابة
  renderView();
}

/* ---------- المزامنة ---------- */
async function syncNow(reason, silent) {
  if (!syncReady()) { if (!silent) toast('المزامنة غير مفعّلة', 'err'); return false; }
  if (_syncing) return false;
  if (!navigator.onLine) { if (!silent) toast('لا يوجد اتصال — ستُزامن عند عودة الشبكة', 'err'); return false; }
  _syncing = true;
  syncPaintBadge();
  try {
    const c = syncCfg();
    let ok = false;
    for (let attempt = 0; attempt < 3 && !ok; attempt++) {
      const pull = await sbRest('GET', 'hisabat_docs?select=*&user_id=eq.' + encodeURIComponent(c.uid));
      if (!pull.ok) throw new Error('فشل الاتصال (' + pull.status + ')');
      const remote = (pull.data && pull.data[0]) || null;

      const payload = syncPayload(S);
      if (!remote) {
        const ins = await sbRest('POST', 'hisabat_docs', { user_id: c.uid, data: payload, rev: 1, updated_at: new Date().toISOString() });
        if (!ins.ok) throw new Error('فشل الحفظ السحابي (' + ins.status + ')');
        c.rev = 1;
        ok = true;
      } else {
        const merged = syncMergeDocs(S, remote.data || {});
        const mergedStr = JSON.stringify(syncPayload(merged));
        const remoteStr = JSON.stringify(remote.data || {});
        if (mergedStr !== remoteStr) {
          const upd = await sbRest('PATCH', 'hisabat_docs?user_id=eq.' + encodeURIComponent(c.uid) + '&rev=eq.' + remote.rev,
            { data: JSON.parse(mergedStr), rev: remote.rev + 1, updated_at: new Date().toISOString() });
          if (!upd.data || !upd.data.length) continue;  // تعارض: أعد المحاولة
          c.rev = remote.rev + 1;
        } else {
          c.rev = remote.rev;
        }
        syncApply(merged);
        ok = true;
      }
    }
    c.lastSyncTs = Date.now();
    saveNow();
    // نقل الإشعارات بعد المزامنة (رفع من المرسل / تنزيل وإقرار على الأرشيف)
    try {
      if (typeof rcptProcess === 'function' && !_rcptBusy) {
        _rcptBusy = true;
        setTimeout(() => { rcptProcess(true).catch(() => {}).then(() => { _rcptBusy = false; }); }, 300);
      }
    } catch (e) {}
    if (!silent) toast('تمت المزامنة ✓', 'ok');
    return true;
  } catch (e) {
    if (!silent) toast('تعذّرت المزامنة: ' + (e.message || 'خطأ غير معروف'), 'err');
    return false;
  } finally {
    _syncing = false;
    syncPaintBadge();
  }
}

function scheduleSync(delay) {
  if (!syncReady()) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => { syncNow('auto', true); }, delay || 4000);
}

/* ---------- تسجيل الدخول ---------- */
async function syncCreds(kind) {
  // بعد تسجيل الخروج تُخفى حقول الرابط/المفتاح، فنرجع إلى الإعدادات المحفوظة
  const c0 = syncCfg() || {};
  const url = ($('#syncUrl') || {}).value || c0.url || '';
  const key = ($('#syncKey') || {}).value || c0.anonKey || '';
  const email = ($('#syncEmail') || {}).value;
  const pass = ($('#syncPass') || {}).value;
  if (!url || !key) { toast('أدخل Project URL و anon key أولاً', 'err'); return; }
  if (!email || !pass) { toast('أدخل البريد وكلمة المرور', 'err'); return; }

  S.settings.sync = Object.assign({}, syncCfg() || {}, {
    url: syncNormUrl(url), anonKey: key.trim(), email: email.trim(), enabled: true
  });
  saveNow();

  if (kind === 'signup') {
    const r = await sbAuthCall('/auth/v1/signup', { email: email.trim(), password: pass });
    if (!r.ok) {
      toast('تعذّر إنشاء الحساب: ' + ((r.data && (r.data.msg || r.data.error_description || r.data.message)) || r.status), 'err');
      return;
    }
  }
  const r2 = await sbAuthCall('/auth/v1/token?grant_type=password', { email: email.trim(), password: pass });
  if (!r2.ok || !r2.data || !r2.data.access_token) {
    const msg = (r2.data && (r2.data.error_description || r2.data.msg || r2.data.error)) || ('كود ' + r2.status);
    toast('تعذّر الدخول: ' + msg + ' — تأكد من إيقاف تأكيد البريد في إعدادات Supabase', 'err');
    saveNow();
    renderView();
    return;
  }
  const c = syncCfg();
  c.accessToken = r2.data.access_token;
  c.refreshToken = r2.data.refresh_token;
  c.expiresAt = Date.now() + (r2.data.expires_in || 3600) * 1000;
  c.uid = r2.data.user && r2.data.user.id;
  saveNow();
  logAct('settings', 'تفعيل المزامنة السحابية (' + c.email + ')');
  renderView();
  const done = await syncNow('login', true);
  toast(done ? 'تم الاتصال والمزامنة ✓' : 'تم الدخول، لكن المزامنة لم تكتمل — تحقق من الجدول (SQL)', done ? 'ok' : 'err');
  renderView();
}

function syncReset() {
  if (!confirm('إعادة ضبط إعدادات المزامنة على هذا الجهاز؟\n(لن تُحذف بياناتك المحلية، ويمكنك الاتصال بنفس الحساب من جديد)')) return;
  S.settings.sync = { enabled: false };
  touchSettings();
  saveNow(); renderView();
  toast('أُعيد ضبط إعدادات المزامنة على هذا الجهاز', 'ok');
}

function syncLogout() {
  const c = syncCfg();
  if (!c) return;
  c.accessToken = ''; c.refreshToken = ''; c.expiresAt = 0; c.lastSyncTs = 0;
  saveNow(); renderView();
  toast('تم تسجيل الخروج من المزامنة (البيانات المحلية باقية)', 'ok');
  logAct('settings', 'إيقاف تسجيل الدخول للمزامنة');
}

      '<ol class="small" style="line-height:2;padding-inline-start:20px;margin:0 0 14px">' +
        '<li>افتح <b>supabase.com</b> ← أنشئ مشروعاً مجانياً (اختر منطقة قريبة، مثل أوروبا).</li>' +
        '<li>من <b>Project Settings ← API</b> انسخ <b>Project URL</b> و<b>anon public key</b> والصقهما في بطاقة المزامنة.</li>' +
        '<li>من <b>Authentication ← Providers ← Email</b> أوقف خيار <b>Confirm email</b> (حتى لا تحتاج رسالة تأكيد).</li>' +
        '<li>من <b>SQL Editor</b> نفّذ السكربت التالي لإنشاء الجدول والسياسات.</li>' +
        '<li>ارجع للبرنامج ← اكتب بريداً وكلمة مرور ← <b>إنشاء حساب + مزامنة</b>. كرّر تسجيل الدخول بنفس الحساب في الجهاز الآخر.</li>' +
      '</ol>' +
      '<textarea id="sqlBox" readonly dir="ltr" style="min-height:190px;font-family:monospace;font-size:12px">' + esc(sql) + '</textarea>' +
      '<div class="small muted" style="margin-top:8px">لا تشارك <b>service_role key</b> مع أحد — البرنامج يحتاج anon key فقط.</div>',
    footer: '<button class="btn" id="copySql">📋 نسخ السكربت</button><button class="btn ghost" data-close>إغلاق</button>',
    after: (wrap) => {
      wrap.querySelector('#copySql').addEventListener('click', () => {
        const t = wrap.querySelector('#sqlBox');
        t.select();
        try { document.execCommand('copy'); toast('تم النسخ ✓', 'ok'); } catch (e) { toast('انسخ يدوياً', 'err'); }
      });
    }
  });
}

/* ---------- بدء التشغيل ---------- */
setTimeout(function () {
  if (syncReady()) {
    syncNow('startup', true);
  }
}, 2500);

setInterval(function () {
  if (syncReady() && navigator.onLine) syncNow('interval', true);
}, 5 * 60 * 1000);

window.addEventListener('online', function () {
  if (syncReady()) syncNow('online', true);
});

</script>

<script>
/* تسجيل عامل الخدمة: updateViaCache='none' يجعل المتصفح يتجاوز كاش HTTP عند سؤال sw.js
   (GitHub Pages يخدمه بـ max-age=600، فكان التحديث يتأخر حتى 10 دقائق على أجهزة المستخدمين)
   + فحص تحديث عند كل فتح وعند العودة إلى الصفحة. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      try { reg.update(); } catch (e) {}
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { try { reg.update(); } catch (e) {} }
      });
    }).catch(function () {});
  });
}
</script>

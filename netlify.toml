# إعداد النشر على Netlify (ملف اختياري — يُستخدم تلقائياً عند رفع هذا المجلد)
[build]
  publish = "."

# رؤوس أمان للصفحة الثابتة
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# عامل الخدمة: لا يُخزَّن مؤقتاً حتى تصل التحديثات فوراً
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# الأيقونات: تُخزَّن طويلاً
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
